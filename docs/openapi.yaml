  /juego-cartas/{user_email}:
    get:
      tags: [Juego de cartas]
      summary: Todas las cartas de un club
      operationId: juegoCartasClub
      description: |
        `CALL SP_juego_cartas_club(:search, :user_email)`. Devuelve **una carta por RUT
        distinto** del club, sobre el chequeo más reciente de cada paciente.

        El orden lo hace el service en PHP, no el SP: en MySQL 5.7 `JSON_ARRAYAGG` **no
        respeta `ORDER BY`**. Se ordena por `puntaje` descendente, con `atributos_medidos`
        descendente como desempate (una carta con los cuatro atributos gana a una que empata
        con solo dos), y las cartas `sin_evaluar` van siempre al final.

        Sin paginación: el club más grande tiene 147 pacientes. Un club inexistente devuelve
        200 con `total: 0` y `cartas: []`.

        A diferencia del resto del dominio de chequeos, aquí **no** se aplica el filtrado por
        `perfiles_id` 3/6: el ámbito es siempre el `user_email` recibido en la ruta.
      parameters:
        - $ref: '#/components/parameters/UserEmailPath'
        - name: search
          in: query
          required: false
          description: |
            Filtro opcional; `LIKE '%search%'` contra `rut` y `nombre`, igual que
            `SP_chequeos_club_prompt`. Vacío o ausente = sin filtro.
          schema:
            type: string
            example: "25527383-3"
      responses:
        '200':
          description: Cartas del club, ordenadas de mejor a peor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Cartas obtenidas correctamente" }
                  data:
                    type: object
                    properties:
                      club: { type: string, example: "brisas@ergosanitas.com" }
                      search: { type: string, nullable: true, example: null }
                      total: { type: integer, example: 118 }
                      cartas:
                        type: array
                        items: { $ref: '#/components/schemas/JuegoCarta' }
              example:
                success: true
                message: "Cartas obtenidas correctamente"
                data:
                  club: "brisas@ergosanitas.com"
                  search: null
                  total: 118
                  cartas:
                    - rut: "23509948-9"
                      nombre: "Alonso David Barrera Osorio"
                      edad: "16"
                      sexo: "Masculino"
                      club: "brisas@ergosanitas.com"
                      id_chequeo: 3702
                      ficha: "#003702"
                      fecha_atencion: "2026-08-14 10:32:00"
                      total_chequeos: 2
                      puntaje: 100
                      estrellas: 5
                      nivel: { slug: alto, nombre: "ALTO", color_fondo: "#dcfce7", color_texto: "#15803d" }
                      atributos:
                        - { slug: corazon, valor: 100, medido: true }
                        - { slug: vitalidad, valor: 100, medido: true }
                        - { slug: composicion, valor: 100, medido: true }
                        - { slug: resistencia, valor: 100, medido: true }
                      atributos_medidos: 4
                      bonus: 0
                      insignia: null
                      bloques_completos: 4
                      progreso: 80
                      estado: { slug: evaluado, nombre: "Evaluado", color_fondo: "#e0e7ff", color_texto: "#4f46e5" }
                      completitud: { chequeo: true, signos_vitales: true, ecg: true, bioimpedancia: false, certificado: true }
        '500':
          description: El SP no existe o falló.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobreErrorA'
              example:
                success: false
                message: "Error obteniendo las cartas"
                error: "SQLSTATE[42000]: PROCEDURE ergosan1_bdd.SP_juego_cartas_club does not exist"

