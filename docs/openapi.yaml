  /chequeo-cardiovascular/{id_paciente}:
    get:
      tags: [Chequeo cardiovascular]
      summary: Detalle de un chequeo por id
      operationId: chequeoRut
      description: |
        Devuelve la fila completa de `chequeo_cardiovascular` con ese `id`, **sin sobre**.

        Cuidado con el orden de las rutas: `pdf/{id}` y `pdfRut/{rut}` están declaradas
        antes en `routes/api.php` justo para que esta ruta genérica no las capture.

        Si el id no existe, `->first()` devuelve `null` y `->toArray()` sobre `null` lanza
        un `Error` que el `catch (\Exception)` **no atrapa**: sale como 500 de Laravel.
      parameters:
        - $ref: '#/components/parameters/IdPaciente'
      responses:
        '200':
          description: Chequeo encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChequeoCardiovascular'
        '500':
          description: Id inexistente o error de ejecución.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobrePlanoB'
              example:
                status: "Error en ejecucion"
                mensaje: "Call to a member function toArray() on null"

    delete:
      tags: [Chequeo cardiovascular]
      summary: Elimina un chequeo por id
      operationId: deleteChequeoById
      description: |
        Borrado físico de la fila. **No borra en cascada** los certificados
        (`certificado_url`) ni los ECG (`electro_cardiogranas`) asociados: quedan huérfanos
        apuntando a un `id_chequeo` inexistente.

        Tampoco revierte la facturación del mes si ese chequeo ya generó un `ADD` en
        `pago_mensual`.

        En `routes/api.php` este parámetro se llama `{id}`, no `{id_paciente}`; se
        documenta aquí junto al GET porque OpenAPI considera idénticas ambas plantillas.

        Un id inexistente devuelve igualmente 200: el `delete()` afecta 0 filas.
      parameters:
        - name: id_paciente
          in: path
          required: true
          description: 'Id del chequeo. En la ruta real el parámetro se llama `{id}`.'
          schema:
            type: integer
            example: 1842
      responses:
        '200':
          description: |
            Borrado ejecutado. El mensaje incluye un typo del código
            (`"Delete con exitoaaa"`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobrePlanoB'
              example:
                status: "OK"
                mensaje: "Delete con exitoaaa1842"
        '500':
          description: Error de ejecución.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobrePlanoB'

  /chequeo-cardiovascular/{id_paciente}/{user_email}:
    put:
      tags: [Chequeo cardiovascular]
      summary: Actualiza un chequeo (el perfil decide qué campos se tocan)
      operationId: updateChequeo
      description: |
        Actualiza el chequeo `{id_paciente}`. El `{user_email}` de la **URL** es el usuario
        que edita, y su perfil determina el alcance del cambio:

        | Perfil | Comportamiento |
        |---|---|
        | 1 (admin) | Además de los campos clínicos, puede cambiar `rut`, `user_email` (club), `status` y `fecha_atencion`. Al terminar propaga el nuevo RUT a `certificado_url` (`CertificadoService::UpdateRutCertificado`) y a `electro_cardiogranas` (`ElectroCardiogramaService::UpdateRutECG`). |
        | 2 (tester) | Fija `fecha_atencion = now()` y `status = 'Testiado'`. |
        | otros | `fecha_atencion` se sobrescribe con el `created_at` del registro. |

        Otros detalles:

        - `nombre` solo se reemplaza si viene con contenido; si llega vacío se conserva el
          actual.
        - Los campos clínicos vacíos vuelven a sus defaults (`No Presenta` /
          `Sin Alteraciones`), **incluso si antes tenían un valor**: enviar el formulario
          incompleto borra información clínica previa.
        - Un request vacío devuelve 400.
        - El id inexistente cae en `firstOrFail()` y sale como 500 con el mensaje del
          `ModelNotFoundException`.
        - El email de la ruta debe ir URL-encoded (`@` -> `%40`).
      parameters:
        - $ref: '#/components/parameters/IdPaciente'
        - name: user_email
          in: path
          required: true
          description: Email del usuario que edita. Su perfil define qué campos se aplican. URL-encoded.
          schema:
            type: string
            format: email
            example: "admin@ergosanitas.com"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string, description: "Si llega vacío se conserva el actual.", example: "Matías Fuentes Rojas" }
                edad: { type: string, example: "15" }
                estatura: { type: string, example: "1.72" }
                peso: { type: string, example: "65.0" }
                pulso: { type: string, example: "66" }
                presionArterial: { type: string, example: "70" }
                presion_sistolica: { type: string, example: "118" }
                saturacionOxigeno: { type: string, example: "99" }
                temperatura: { type: string, example: "36.4" }
                hemoglucotest: { type: string, example: "90" }
                fechaNacimiento: { type: string, example: "2010-04-22" }
                sexo_paciente: { type: string, example: "Masculino" }
                imc_paciente: { type: string, example: "22.0" }
                division_paciente: { type: string, example: "Sub 17" }
                medio_pago_paciente: { type: string, example: "Transferencia" }
                user_email_perfil: { type: string, format: email, description: "Se guarda en `user_email_update`.", example: "admin@ergosanitas.com" }
                enfermedadesCronicas: { type: string, example: "Asma bronquial" }
                medicamentosDiarios: { type: string, example: "Salbutamol SOS" }
                sistemaOsteoarticular: { type: string, example: "Sin Alteraciones" }
                sistemaCardiovascular: { type: string, example: "Sin Alteraciones" }
                enfermedadesAnteriores: { type: string, example: "Sin Alteraciones" }
                Recuperacion: { type: string, example: "Sin Alteraciones" }
                gradoIncidenciaPosterio: { type: string, example: "Sin Alteraciones" }
                rut: { type: string, description: "**Solo perfil 1.** Al cambiarlo se propaga a certificados y ECG.", example: "21345678-9" }
                user_email: { type: string, format: email, description: "**Solo perfil 1.** Reasigna el chequeo a otro club.", example: "club.deportivo@ergosanitas.com" }
                status: { type: string, description: "**Solo perfil 1.**", enum: [ingresado, Testiado, "ECG FOTO", "REVISION MEDICA"], example: "REVISION MEDICA" }
                fecha_atencion: { type: string, description: "**Solo perfil 1.** Se parsea con Carbon.", example: "2026-09-04 09:31:00" }
            examples:
              tester:
                summary: Perfil 2 corrigiendo signos vitales
                value:
                  nombre: "Matías Fuentes Rojas"
                  edad: "15"
                  estatura: "1.72"
                  peso: "65.0"
                  pulso: "66"
                  presionArterial: "70"
                  presion_sistolica: "118"
                  saturacionOxigeno: "99"
                  temperatura: "36.4"
                  hemoglucotest: "90"
                  user_email_perfil: "tester.terreno@ergosanitas.com"
              admin:
                summary: Perfil 1 corrigiendo el RUT y reasignando el club
                value:
                  nombre: "Matías Fuentes Rojas"
                  rut: "21345678-9"
                  user_email: "escuela.futbol@ergosanitas.com"
                  status: "ECG FOTO"
                  fecha_atencion: "2026-09-04 09:31:00"
                  user_email_perfil: "admin@ergosanitas.com"
      responses:
        '200':
          description: Chequeo modificado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobrePlanoB'
              example:
                status: "OK"
                mensaje: "Modificado con exito"
        '400':
          description: Request vacío.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobrePlanoB'
              example:
                status: "Bad Request"
                mensaje: "Http NO trae Datos para Procesar"
        '500':
          description: |
            Id inexistente o error al guardar. **Nota el cambio de sobre respecto del
            éxito**: aquí viene anidado bajo `response`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobreRespuestaB'
              example:
                response:
                  status: "Error en ejecucion"
                  mensaje: "No query results for model [App\\Models\\ChequeoCardiovascular]."

