          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobreRespuestaB'

  # ====================================================================
  # INCIDENCIAS DEPORTIVAS
  # ====================================================================

  /incidencia-deportivos/create:
    post:
      tags: [Incidencias deportivas]
      summary: Registra una lesión deportiva
      operationId: incidenciaCreate
      description: |
        Inserta una fila en `incidentes_deportivos`. **No hay validación de ningún campo**:
        lo que no venga se guarda como `null` y, en modo estricto de MySQL, hace fallar el
        insert.

        Diferencia clave entre dos columnas que parecen lo mismo:

        - `user_email` — quien registra la incidencia.
        - `club_deportivo` — **la columna por la que filtran todas las consultas y
          estadísticas del módulo**. Si se deja vacía, la incidencia no aparecerá en ningún
          listado ni estadística.

        `gravedad` es texto libre, pero el contador de gravedad compara con la cadena exacta
        `'Leve (sin tiempo fuera)'`.

        El servicio captura la excepción, la registra en el log y devuelve `null`, lo que el
        controlador traduce a un 500 genérico sin el mensaje del error.

        Devuelve **201** con el `id` de la fila creada en `data`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombres: { type: string, example: "Matías Fuentes Rojas" }
                edad: { type: string, example: "15" }
                deporte: { type: string, example: "Fútbol" }
                tipo_lesion: { type: string, example: "Esguince" }
                ubicacion: { type: string, example: "Entrenamiento" }
                parte_cuerpo: { type: string, example: "Tobillo derecho" }
                descripcion: { type: string, example: "Torsión en cambio de dirección sobre pasto húmedo" }
                primeros_auxilios: { type: string, example: "Hielo local y vendaje compresivo" }
                gravedad:
                  type: string
                  description: 'Para que el contador de gravedad lo cuente debe ser exactamente `Leve (sin tiempo fuera)`.'
                  example: "Leve (sin tiempo fuera)"
                estado: { type: string, example: "En tratamiento" }
                user_email: { type: string, format: email, description: Quien registra., example: "kine.club@ergosanitas.com" }
                liga: { type: string, example: "Liga Regional O'Higgins" }
                club_deportivo:
                  type: string
                  format: email
                  description: '**Clave del filtrado.** Sin este valor la incidencia no aparece en ninguna consulta.'
                  example: "club.deportivo@ergosanitas.com"
                categoria: { type: string, example: "Sub 17" }
                rut_paciente: { type: string, example: "21345678-9" }
            examples:
              lesion:
                summary: Esguince leve en entrenamiento
                value:
                  nombres: "Matías Fuentes Rojas"
                  edad: "15"
                  deporte: "Fútbol"
                  tipo_lesion: "Esguince"
                  ubicacion: "Entrenamiento"
                  parte_cuerpo: "Tobillo derecho"
                  descripcion: "Torsión en cambio de dirección sobre pasto húmedo"
                  primeros_auxilios: "Hielo local y vendaje compresivo"
                  gravedad: "Leve (sin tiempo fuera)"
                  estado: "En tratamiento"
                  user_email: "kine.club@ergosanitas.com"
                  liga: "Liga Regional O'Higgins"
                  club_deportivo: "club.deportivo@ergosanitas.com"
                  categoria: "Sub 17"
                  rut_paciente: "21345678-9"
      responses:
        '201':
          description: Incidencia creada. `data` trae el id generado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidenciaEnvoltorio'
              example:
                status: "success"
                message: "Incidencia creada correctamente"
                data: 128
        '500':
          description: Falló el insert (mensaje genérico; el detalle queda en el log de Laravel).
          content:
            application/json:
              example:
                status: "error"
                message: "Error al crear la incidencia"

  /incidencia-deportivos/find-by-user/{user_email}:
    get:
      tags: [Incidencias deportivas]
      summary: Incidencias de un club
      operationId: findIncidenciasByUserEmail
      description: |
        Lista las incidencias donde `club_deportivo = {user_email}`, ordenadas por `id`
        descendente. **Filtra por `club_deportivo`, no por `user_email`.**

        Devuelve **201**, no 200 (convención propia del controlador).

        Si el club no tiene incidencias, la colección vacía se evalúa como falsa en el `if`
        del controlador y la respuesta es **500 "Error al listar las incidencias"**, aunque
        no haya ocurrido ningún error.
      parameters:
        - $ref: '#/components/parameters/UserEmailPath'
      responses:
        '201':
          description: Listado de incidencias.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "success" }
                  message: { type: string, example: "Incidencia lista correctamente" }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IncidenteDeportivo'
              example:
                status: "success"
                message: "Incidencia lista correctamente"
                data:
                  - id: 128
                    nombres: "Matías Fuentes Rojas"
                    edad: "15"
                    deporte: "Fútbol"
                    tipo_lesion: "Esguince"
                    ubicacion: "Entrenamiento"
                    parte_cuerpo: "Tobillo derecho"
                    descripcion: "Torsión en cambio de dirección sobre pasto húmedo"
                    primeros_auxilios: "Hielo local y vendaje compresivo"
                    gravedad: "Leve (sin tiempo fuera)"
                    estado: "En tratamiento"
                    user_email: "kine.club@ergosanitas.com"
                    liga: "Liga Regional O'Higgins"
                    club_deportivo: "club.deportivo@ergosanitas.com"
                    categoria: "Sub 17"
                    rut_paciente: "21345678-9"
                    created_at: "2026-08-30T18:12:00.000000Z"
                    updated_at: "2026-08-30T18:12:00.000000Z"
        '500':
          description: Error, **o simplemente que el club no tiene incidencias**.
          content:
            application/json:
              example:
                status: "error"
                message: "Error al listar las incidencias"

  /incidencia-deportivos/count-club/{user_email}:
    get:
      tags: [Incidencias deportivas]
      summary: Total de incidencias del club
      operationId: countClub
      description: |
        `COUNT(*)` de `incidentes_deportivos` con `club_deportivo = {user_email}`.

        **Un club con 0 incidencias devuelve 500**: el `0` se evalúa como falso en el `if`
        del controlador. Nunca verás `data: 0`.
      parameters:
        - $ref: '#/components/parameters/UserEmailPath'
      responses:
        '201':
          description: Conteo.
          content:
            application/json:
              example:
                status: "success"
                message: "Incidencia lista correctamente"
                data: 14
        '500':
          description: Error, **o conteo igual a 0**.
          content:
            application/json:
              example:
                status: "error"
                message: "Error al listar las incidencias"

  /incidencia-deportivos/count-gravedad/{user_email}:
    get:
      tags: [Incidencias deportivas]
      summary: Total de incidencias leves del club
      operationId: countGravedad
      description: |
        Cuenta las incidencias del club con
        `gravedad = 'Leve (sin tiempo fuera)'` — **comparación exacta**. Cualquier otra
        redacción de la gravedad no entra en el conteo.

        Igual que el anterior: un conteo de 0 sale como 500.
      parameters:
