  /chequeo-cardiovascular/like-chequeo:
    post:
      tags: [Chequeo cardiovascular]
      summary: Búsqueda simple por RUT o nombre (sin perfil)
      operationId: likeChequeo
      description: |
        `WHERE rut LIKE %texto% OR nombre LIKE %texto%` sobre toda la tabla,
        **sin filtrado por perfil y sin paginación**. Devuelve las filas crudas de
        `chequeo_cardiovascular`, sin el join al ECG.

        Requiere cuerpo JSON parseable a array (lee `php://input`) o responde 400.

        Detalle del `catch`: si la query falla, el controlador **llama a `Index()` y
        devuelve la tabla completa** en lugar del error.

        Prefiere `search-chequeo`, que respeta el perfil y pagina.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                textoValue: { type: string, example: "21345678" }
              required: [textoValue]
            examples:
              porRut:
                summary: Fragmento de RUT
                value:
                  textoValue: "21345678"
              porNombre:
                summary: Fragmento de nombre
                value:
                  textoValue: "Fuentes"
      responses:
        '200':
          description: Coincidencias.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChequeoCardiovascular'
        '400':
          description: El cuerpo no es un JSON válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobrePlanoB'
              example:
                status: "Bad Request"
                mensaje: "Http NO trae Datos para Procesar"

  /chequeo-cardiovascular/like-chequeo/user:
    post:
      tags: [Chequeo cardiovascular]
      summary: Búsqueda por RUT o nombre respetando el perfil 3
      operationId: likeChequeoUser
      description: |
        Igual que `like-chequeo`, pero con el join al ECG, el `estado_paciente` derivado y
        la restricción `cc.user_email = :user_email` **cuando el perfil es 3**.

        Sigue sin paginar y sin aplicar la regla del perfil 6.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                textoValue: { type: string, description: "Fragmento de RUT o de nombre.", example: "Fuentes" }
                user_email: { type: string, format: email, example: "club.deportivo@ergosanitas.com" }
              required: [textoValue, user_email]
            examples:
              porNombre:
                value:
                  textoValue: "Fuentes"
                  user_email: "club.deportivo@ergosanitas.com"
      responses:
        '200':
          description: Coincidencias con estado derivado.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChequeoConEstado'
        '400':
          description: El cuerpo no es un JSON válido.
        '500':
          description: Error de ejecución.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobrePlanoB'

  /chequeo-cardiovascular/search-chequeo:
    post:
      tags: [Chequeo cardiovascular]
      summary: Búsqueda paginada con filtros y reglas de perfil (endpoint principal de la UI)
      operationId: searchChequeo
      description: |
        Es el endpoint que alimenta la grilla del sistema. Combina cuatro cosas:

        **1. Subquery del último ECG.** Une solo el ECG más reciente por `id_chequeo`
        (`ORDER BY created_at DESC LIMIT 1`), de modo que un paciente con varios ECG no
        duplica filas.

        **2. Filtros.**
        - `textoValue` -> `cc.rut LIKE %v% OR cc.nombre LIKE %v%`
        - `fechaCalendar` -> `DATE(cc.created_at) = f OR DATE(cc.fecha_atencion) = f`
          (se parsea con Carbon, acepta `YYYY-MM-DD`)
        - `selectClub` -> `cc.user_email = club`, **ignorado si el perfil es 3**

        **3. Reglas de perfil.**
        - Perfil 3: `cc.user_email = :user_email` y orden
          `FIELD(cc.status, 'ECG FOTO', 'REVISION MEDICA', 'Testiado', 'ingresado')` antes
          de `created_at DESC`.
        - Perfil 6: `cc.status = 'ECG FOTO'` **y** join con `certificado_url` por
          `(rut, id_chequeo)` con `cu.derivado_medico = 'SI'`.
        - Resto: sin restricción, orden `created_at DESC`.

        **4. Paginación con dos modos.**
        - **Sin ningún filtro** usa `simplePaginate(min(limit, 300))` y devuelve el campo
          `total` con el literal **300**, que no es el total real de filas. No lo uses para
          calcular el número de páginas en ese modo; guíate por `next_page_url`.
        - **Con al menos un filtro** usa `paginate($limit)` y `total` sí es el conteo real.

        Defaults: `limit = 20`, `page = 1`. El `limit` se topa en 300 solo en el modo sin
        filtros.

        El campo `data` trae un subconjunto de columnas (no la fila completa) más las
        derivadas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_email:
                  type: string
                  format: email
                  description: Usuario que consulta; define el perfil aplicado.
                  example: "club.deportivo@ergosanitas.com"
                textoValue:
                  type: string
                  nullable: true
                  description: Fragmento de RUT o nombre. Vacío o ausente = sin filtro.
                  example: "Fuentes"
                fechaCalendar:
                  type: string
                  nullable: true
                  description: Fecha a comparar contra `created_at` o `fecha_atencion`.
                  example: "2026-09-04"
                selectClub:
                  type: string
                  nullable: true
                  description: Email del club a filtrar. **Ignorado para el perfil 3.**
                  example: "escuela.futbol@ergosanitas.com"
                limit:
                  type: integer
                  default: 20
                  description: Filas por página. Topado en 300 cuando no hay filtros.
                  example: 20
                page:
                  type: integer
                  default: 1
                  example: 1
              required: [user_email]
            examples:
              primeraPagina:
                summary: Primera página sin filtros (modo simplePaginate, `total` = 300 fijo)
                value:
                  user_email: "club.deportivo@ergosanitas.com"
                  textoValue: ""
                  fechaCalendar: ""
                  selectClub: ""
                  limit: 20
                  page: 1
              porTexto:
                summary: Búsqueda por apellido (modo paginate, `total` real)
                value:
                  user_email: "club.deportivo@ergosanitas.com"
                  textoValue: "Fuentes"
                  limit: 20
                  page: 1
              porFechaYClub:
                summary: Admin filtrando un club en una fecha
                value:
                  user_email: "admin@ergosanitas.com"
                  fechaCalendar: "2026-09-04"
                  selectClub: "escuela.futbol@ergosanitas.com"
                  limit: 50
                  page: 1
      responses:
        '200':
          description: Página de resultados.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, example: 1842 }
                        rut: { type: string, example: "21345678-9" }
                        nombre: { type: string, example: "Matías Fuentes Rojas" }
                        user_email: { type: string, format: email, example: "club.deportivo@ergosanitas.com" }
                        status: { type: string, example: "REVISION MEDICA" }
                        edad: { type: string, example: "15" }
                        created_at: { type: string, example: "2026-09-03 18:22:10" }
                        fecha_atencion: { type: string, nullable: true, example: "2026-09-04 09:31:00" }
                        fecha_atencion_formatted: { type: string, nullable: true, example: "04/09/2026" }
                        created_at_formatted: { type: string, example: "03/09/2026" }
                        estado_paciente: { type: string, example: "Diag. Card. - Normal" }
                        frecuencia_cardiaca_paciente: { type: string, example: "72" }
                        derivacion_paciente: { type: string, example: "No requiere" }
                        observacion_paciente: { type: string, example: "Ritmo sinusal." }
                  current_page: { type: integer, example: 1 }
                  per_page: { type: integer, example: 20 }
                  next_page_url: { type: string, nullable: true, example: "http://127.0.0.1:8000/api/chequeo-cardiovascular/search-chequeo?page=2" }
                  prev_page_url: { type: string, nullable: true, example: null }
                  total:
                    type: integer
                    description: '**Literal 300 cuando no hay filtros**; conteo real cuando sí los hay.'
                    example: 300
              examples:
                sinFiltros:
                  summary: Sin filtros — `total` es el literal 300
                  value:
                    data:
                      - id: 1842
                        rut: "21345678-9"
                        nombre: "Matías Fuentes Rojas"
                        user_email: "club.deportivo@ergosanitas.com"
                        status: "REVISION MEDICA"
                        edad: "15"
                        created_at: "2026-09-03 18:22:10"
                        fecha_atencion: "2026-09-04 09:31:00"
                        fecha_atencion_formatted: "04/09/2026"
                        created_at_formatted: "03/09/2026"
                        estado_paciente: "Diag. Card. - Normal"
                        frecuencia_cardiaca_paciente: "72"
                        derivacion_paciente: "No requiere"
                        observacion_paciente: "Ritmo sinusal. Sin criterios de derivación."
                      - id: 1841
                        rut: "20987654-3"
                        nombre: "Camila Soto Vergara"
                        user_email: "club.deportivo@ergosanitas.com"
                        status: "ECG FOTO"
                        edad: "16"
                        created_at: "2026-09-03 18:05:44"
                        fecha_atencion: null
                        fecha_atencion_formatted: null
                        created_at_formatted: "03/09/2026"
                        estado_paciente: "ECG FOTO"
                        frecuencia_cardiaca_paciente: "-"
                        derivacion_paciente: "-"
                        observacion_paciente: "-"
                    current_page: 1
                    per_page: 20
                    next_page_url: "http://127.0.0.1:8000/api/chequeo-cardiovascular/search-chequeo?page=2"
                    prev_page_url: null
                    total: 300
                conFiltro:
                  summary: Con filtro — `total` es el conteo real
                  value:
                    data:
                      - id: 1842
                        rut: "21345678-9"
                        nombre: "Matías Fuentes Rojas"
                        user_email: "club.deportivo@ergosanitas.com"
                        status: "REVISION MEDICA"
                        edad: "15"
                        created_at: "2026-09-03 18:22:10"
                        fecha_atencion: "2026-09-04 09:31:00"
                        fecha_atencion_formatted: "04/09/2026"
                        created_at_formatted: "03/09/2026"
                        estado_paciente: "Diag. Card. - Normal"
                        frecuencia_cardiaca_paciente: "72"
                        derivacion_paciente: "No requiere"
                        observacion_paciente: "Ritmo sinusal."
                    current_page: 1
                    per_page: 20
                    next_page_url: null
                    prev_page_url: null
                    total: 1
        '400':
          description: El cuerpo no es un JSON válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobrePlanoB'
              example:
                status: "Bad Request"
                mensaje: "Http NO trae Datos para Procesar"
        '500':
          description: Error de ejecución.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobrePlanoB'

  /chequeo-cardiovascular/filter-calendar:
    post:
      tags: [Chequeo cardiovascular]
      summary: Chequeos de una fecha concreta
      operationId: filterCalendar
      description: |
        Devuelve los chequeos cuyo `created_at` **o** `fecha_atencion` cae en la fecha
        indicada, con el join al ECG y el `estado_paciente` derivado.

        Aplica solo la regla del perfil 3 (`cc.user_email = :user_email`). Sin paginación.

        `fecha_calendar` se parsea con `Carbon::parse()`: acepta `YYYY-MM-DD` y otros
        formatos que Carbon entienda, pero una cadena no parseable lanza excepción y sale
        como 500.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fecha_calendar: { type: string, format: date, example: "2026-09-04" }
                user_email: { type: string, format: email, example: "club.deportivo@ergosanitas.com" }
              required: [fecha_calendar, user_email]
            examples:
              dia:
                value:
                  fecha_calendar: "2026-09-04"
                  user_email: "club.deportivo@ergosanitas.com"
      responses:
        '200':
          description: Chequeos de esa fecha.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChequeoConEstado'
        '400':
          description: El cuerpo no es un JSON válido.
        '500':
          description: Fecha no parseable o error de ejecución.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobrePlanoB'

  /chequeo-cardiovascular/club-deportivo:
    post:
      tags: [Chequeo cardiovascular]
      summary: Todos los chequeos de un club
      operationId: chequeoUserEmail
      description: |
        Filtra **siempre** por `cc.user_email = :user_email`, sin mirar el perfil: devuelve
        los chequeos de ese club con las columnas completas más `fecha_atencion_format`,
        `created_at_format` y los datos del último ECG.

        Diferencia con los otros listados: aquí el `estado_paciente` es
        `IFNULL(ec.estado_paciente, 'En Revision')` — el valor crudo del ECG, sin el prefijo
        `Diag. Card. -`.

        El join es por `rut`, no por `id_chequeo`: un paciente con varios chequeos y varios
        ECG puede producir filas duplicadas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_email: { type: string, format: email, example: "club.deportivo@ergosanitas.com" }
              required: [user_email]
            examples:
              club:
                value:
                  user_email: "club.deportivo@ergosanitas.com"
      responses:
        '200':
          description: Chequeos del club.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/ChequeoCardiovascular'
                    - type: object
                      properties:
                        fecha_atencion_format: { type: string, nullable: true, example: "04/09/2026" }
                        created_at_format: { type: string, example: "03/09/2026" }
                        estado_paciente: { type: string, example: "Normal" }
                        frecuencia_cardiaca_paciente: { type: string, example: "72" }
                        derivacion_paciente: { type: string, example: "No requiere" }
                        observacion_paciente: { type: string, example: "Ritmo sinusal." }
        '500':
          description: |
            Error de ejecución. **Este endpoint devuelve el mensaje como string plano**, no
            como objeto.
          content:
            application/json:
              schema:
                type: string
              example: "SQLSTATE[42S22]: Column not found"

  /chequeo-cardiovascular/chequeo-all:
    post:
      tags: [Chequeo cardiovascular]
      summary: Export completo de chequeos con reglas de perfil
      operationId: chequeoEmailAll
      description: |
        Pensado para exportes y envíos masivos. Devuelve un subconjunto plano de columnas
        (los datos clínicos que se usan en el informe) más `estado_paciente` y
        `frecuencia_cardiaca_paciente`.

        Une el **último ECG por `id_chequeo`** mediante `MAX(id)`, no por fecha.

        Reglas de perfil aplicadas: 3 (solo su club) y 6 (`INNER JOIN certificado_url` con
        `derivado_medico = 'SI'` — nota que aquí es `join`, no `leftJoin`, así que el perfil
        6 nunca ve chequeos sin certificado).

        `fecha_atencion` viene formateada `dd-mm-YYYY` (con guiones) y cae a `created_at`
        cuando la atención no tiene fecha.

        Sin paginación: es un export completo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_email: { type: string, format: email, example: "club.deportivo@ergosanitas.com" }
              required: [user_email]
            examples:
              club:
                summary: Export del propio club (perfil 3)
                value:
                  user_email: "club.deportivo@ergosanitas.com"
              medico:
                summary: Export del medico (perfil 6) — solo derivados
                value:
                  user_email: "medico.cardiologo@ergosanitas.com"
      responses:
        '200':
          description: Export generado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, example: 200 }
                  mensaje: { type: string, example: "Chequeo obtenido correctamente." }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, example: 1842 }
                        nombre: { type: string, example: "Matías Fuentes Rojas" }
                        rut: { type: string, example: "21345678-9" }
                        edad: { type: string, example: "15" }
                        estatura: { type: string, example: "1.72" }
                        peso: { type: string, example: "64.5" }
                        hemoglucotest: { type: string, example: "92" }
                        presionArterial: { type: string, example: "70" }
                        presion_sistolica: { type: string, example: "120" }
                        saturacionOxigeno: { type: string, example: "98" }
                        temperatura: { type: string, example: "36.5" }
                        imc_paciente: { type: string, example: "21.8" }
                        sexo_paciente: { type: string, example: "Masculino" }
                        user_email: { type: string, format: email, example: "club.deportivo@ergosanitas.com" }
                        status: { type: string, example: "REVISION MEDICA" }
                        fecha_atencion: { type: string, example: "04-09-2026" }
                        estado_paciente: { type: string, example: "Diag. Card. - Normal" }
                        frecuencia_cardiaca_paciente: { type: string, example: "72" }
              example:
                status: 200
                mensaje: "Chequeo obtenido correctamente."
                data:
                  - id: 1842
                    nombre: "Matías Fuentes Rojas"
                    rut: "21345678-9"
                    edad: "15"
                    estatura: "1.72"
                    peso: "64.5"
                    hemoglucotest: "92"
                    presionArterial: "70"
                    presion_sistolica: "120"
                    saturacionOxigeno: "98"
                    temperatura: "36.5"
                    imc_paciente: "21.8"
                    sexo_paciente: "Masculino"
                    user_email: "club.deportivo@ergosanitas.com"
                    status: "REVISION MEDICA"
                    fecha_atencion: "04-09-2026"
                    estado_paciente: "Diag. Card. - Normal"
                    frecuencia_cardiaca_paciente: "72"
        '400':
          description: El cuerpo no es un JSON válido.
          content:
            application/json:
              example:
                status: 400
                mensaje: "La solicitud no contiene datos válidos para procesar."
        '500':
          description: Error interno.
          content:
            application/json:
              example:
                status: 500
                mensaje: "Error interno: SQLSTATE[42S22]: Column not found"

  /chequeo-cardiovascular/estado-general/{user_email}:
    get:
      tags: [Chequeo cardiovascular]
      summary: Resumen del estado general de los pacientes del club
      operationId: estadoGeneral
      description: |
        Ejecuta `CALL SP_estado_general(:user_email)` y devuelve **el JSON del SP tal cual**,
        sin sobre.

        La forma exacta la define el procedimiento almacenado, que no está versionado en el
        repo. El ejemplo de abajo es representativo.
      parameters:
        - $ref: '#/components/parameters/UserEmailPath'
      responses:
        '200':
          description: Resumen devuelto por el SP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoSP'
              example:
                total_pacientes: 248
                normales: 213
                alterados: 12
                en_revision: 23
        '500':
          description: El SP no existe o falló.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobreRespuestaB'
              example:
                response:
                  status: "Error en ejecucion"
                  mensaje: "SQLSTATE[42000]: PROCEDURE ergosanitas.SP_estado_general does not exist"

  /chequeo-cardiovascular/pdf/{id_paciente}:
    get:
      tags: [Chequeo cardiovascular]
      summary: Certificado del chequeo en PDF (por id)
      operationId: chequeoPDF
      description: |
        Genera el certificado con **mPDF** a partir del HTML que arma
        `ChequeoCardiovascularPDFService::chequeoPDf()` y lo devuelve como descarga.

        El nombre del archivo es `Certificado {Nombre Del Paciente}.pdf`.

        Los assets del documento (`logo.png`, `firmarDoctor.jpg`, `firmarErgo.jpg`,
        `watermark.png`, `firma_cardiologo.jpeg`) se leen con `public_path()`: si faltan en
        el contenedor, mPDF lanza excepción **no capturada** y sale un 500 de Laravel.

        Un id inexistente también revienta al leer el nombre del paciente sobre `null`.
      parameters:
        - $ref: '#/components/parameters/IdPaciente'
      responses:
        '200':
          description: PDF del certificado.
          headers:
            Content-Disposition:
              schema:
                type: string
              example: 'attachment; filename="Certificado Matías Fuentes Rojas.pdf"'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '500':
          description: Id inexistente, asset faltante o error de mPDF.

  /chequeo-cardiovascular/pdfRut/{rut_paciente}:
    get:
      tags: [Chequeo cardiovascular]
      summary: Certificado del chequeo en PDF (por RUT)
      operationId: chequeoPDFRut
      description: |
        Busca el **último** chequeo del RUT (`ORDER BY id DESC`) y delega en
        `GET /chequeo-cardiovascular/pdf/{id}`.

        Es el único endpoint de PDF que responde un 404 limpio cuando no encuentra al
        paciente.
      parameters:
        - $ref: '#/components/parameters/RutPaciente'
      responses:
        '200':
          description: PDF del certificado del último chequeo del paciente.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: No hay chequeos para ese RUT.
          content:
            application/json:
              example:
                error: "Paciente no encontrado"
        '500':
          description: Error al generar el PDF.

  /chequeo-cardiovascular-word/{id_paciente}:
    get:
      tags: [Chequeo cardiovascular]
      summary: Certificado del chequeo en Word (.docx)
      operationId: chequeoWord
      description: |
        Misma información que el PDF pero generada con **PHPWord** a partir del HTML de
        `ChequeoCardiovascularWordService::chequeoWord()`, y enviada con
        `response()->streamDownload()` sin escribir en disco.

        El nombre del archivo es fijo: **`documento_desde_html.docx`** para todos los
        pacientes.

        No hay `try/catch`: un id inexistente o un fallo de conversión sale como 500 de
        Laravel.
      parameters:
        - $ref: '#/components/parameters/IdPaciente'
      responses:
        '200':
          description: Documento Word.
          headers:
            Content-Disposition:
              schema:
                type: string
              example: 'attachment; filename="documento_desde_html.docx"'
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '500':
          description: Id inexistente o error de PHPWord.

  /file-upload:
    post:
      tags: [Chequeo cardiovascular]
      summary: Sube la foto del ECG y marca el chequeo
      operationId: fileUploadRes
      description: |
        Endpoint legado de subida de la foto del electrocardiograma. Guarda el archivo con
        nombre `{timestamp}.{jpg|png}` y actualiza el chequeo del RUT poniendo
        `fileStatus = 'OK'` y `fileName`.

        Advertencias importantes del código:

        - Valida `file` como `jpg,png` de máximo ~5 MB. **Los mensajes de validación tienen
          typos** (`file.requierd`, `file.mines`), así que nunca se muestran.
        - Usa `copy($_FILES['file']['tmp_name'], 'Electrocardiograma/'.$archivo)` con **ruta
          relativa al directorio de trabajo de PHP**, no `public_path()`. Si la carpeta no
          existe, el `copy()` falla con warning y el registro igual queda marcado como `OK`.
        - Un MIME distinto de `image/png` o `image/jpeg` deja `$archivo` sin definir.
        - `firstOrFail()` sobre el RUT: un RUT sin chequeos devuelve 404.
        - **No factura** ni cambia el `status` del chequeo, a diferencia de
          `/certificado/save-url`.

        Para el flujo vigente de certificados usa `POST /certificado/save-url`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Imagen JPG o PNG, máximo 5048 KB.
                rut:
                  type: string
                  example: "21345678-9"
              required: [file, rut]
      responses:
        '200':
          description: Archivo procesado.
          content:
            application/json:
              example:
                success: true
                message: "Archivo subido con éxito."
        '404':
          description: No existe un chequeo con ese RUT.
        '422':
          description: El archivo no es JPG/PNG o supera el tamaño máximo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'

  # ====================================================================
  # CERTIFICADOS
  # ====================================================================

  /certificado/save-url:
    post:
      tags: [Certificados]
      summary: Sube el certificado/ECG del paciente — CAMBIA EL ESTADO Y FACTURA
      operationId: fileUploadCer
      description: |
        Endpoint vigente de subida del certificado. Hace **cinco cosas**, en este orden:

        1. **Borra** las filas previas de `certificado_url` del par `(rut_paciente,
           id_chequeo)`. El archivo físico anterior no se elimina, pero el nombre es
           determinista (`{rut}-{id_chequeo}.{ext}`), así que se sobrescribe.
        2. Mueve el archivo a `public/Certificado/{rut}-{id_chequeo}.{extensión}`.
        3. Inserta la fila nueva en `certificado_url` con `url_pdf`, `name_pdf`
           (nombre con guiones), `titulo` y `derivado_medico`.
        4. Marca el chequeo con `status = 'ECG FOTO'` (`firstOrFail` sobre `id_paciente`).
        5. Lee `params.VALOR-ECG` y llama a
           `SP_pago_mensual(hoy, club_del_chequeo, valor_ecg, 'ADD')`.

        ### Consecuencias operativas

        - **Cada subida factura.** Reintentar una carga fallida vuelve a sumar el cargo al
          mes del club. No hay idempotencia.
        - `derivado_medico = 'SI'` es lo que hace visible el chequeo para el perfil 6.
        - Si falta la fila `VALOR-ECG` en `params`, el `firstOrFail()` responde 500
          **después** de haber movido el archivo, guardado la fila y cambiado el estado.
        - **No hay validación del archivo**: ni tipo, ni tamaño, ni extensión.
        - Si no llega archivo o el upload es inválido, la función **no retorna nada**:
          respuesta 200 con cuerpo vacío y sin efecto alguno.
        - `API_PATH_CER` se lee con `env()` en el servicio: con `config:cache` la URL queda
          mal armada.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF o imagen del certificado/ECG. Sin validación.
                rut_paciente:
                  type: string
                  example: "21345678-9"
                id_paciente:
                  type: integer
                  description: Id del chequeo (`chequeo_cardiovascular.id`).
                  example: 1842
                nombre_paciente:
                  type: string
                  description: Se normaliza con `ucwords(strtolower(...))` para `titulo` y `name_pdf`.
                  example: "matías fuentes rojas"
                derivado_medico:
                  type: string
                  enum: ["SI", "NO"]
                  description: '`SI` hace visible el chequeo para el perfil médico (6).'
                  example: "SI"
              required: [file, rut_paciente, id_paciente, nombre_paciente]
      responses:
        '200':
          description: |
            Certificado guardado, chequeo marcado como `ECG FOTO` y mes facturado — **o**
            cuerpo vacío si no llegó un archivo válido.
          content:
            application/json:
              example:
                success: true
                message: "Archivo subido con éxito."
        '404':
          description: El `id_paciente` no existe en `chequeo_cardiovascular` (`firstOrFail`).
        '500':
          description: |
            Falta la fila `VALOR-ECG` en `params`, o falló `SP_pago_mensual`. El archivo y
            la fila del certificado ya quedaron guardados.

  /certificado/path-url:
    post:
      tags: [Certificados]
      summary: Obtiene la URL del certificado por RUT y/o id de chequeo
      operationId: pathUrlCertificado
      description: |
        Devuelve el certificado más reciente que cumpla los filtros enviados. Los dos
        filtros son **opcionales e independientes**: si no envías ninguno devuelve el último
        certificado de toda la tabla.

        **Todas las respuestas son HTTP 200**, incluido el "no encontrado" y el error: el
        resultado real está en el campo `status` del cuerpo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rut_paciente: { type: string, nullable: true, example: "21345678-9" }
                id_paciente: { type: integer, nullable: true, description: "Id del chequeo.", example: 1842 }
            examples:
              porAmbos:
                summary: Certificado de un chequeo concreto
                value:
                  rut_paciente: "21345678-9"
                  id_paciente: 1842
              soloRut:
                summary: Último certificado del paciente
                value:
                  rut_paciente: "21345678-9"
      responses:
        '200':
          description: |
            Resultado de la consulta. **Mira `status` dentro del cuerpo**, no el código HTTP.
          content:
            application/json:
              examples:
                encontrado:
                  summary: Certificado encontrado
                  value:
                    status: 200
                    url_pdf: "http://127.0.0.1:8000/Certificado/21345678-9-1842.pdf"
                    name_pdf: "Matías-Fuentes-Rojas"
                    titulo: "Matías Fuentes Rojas"
                noEncontrado:
                  summary: Sin coincidencias (igual devuelve HTTP 200)
                  value:
                    status: 404
                    mensaje: "No se encontró un certificado con los filtros enviados"
                error:
                  summary: Error de base (igual devuelve HTTP 200)
                  value:
                    status: 500
                    error: "Error en la consulta: SQLSTATE[42S02]: Base table or view not found"

  /certificado/valida-certificado:
    post:
      tags: [Certificados]
      summary: Certificado de un chequeo ya cerrado por el médico
      operationId: validaCertificado
      description: |
        Igual que `path-url` pero **solo devuelve certificados de chequeos en estado
        `REVISION MEDICA`**, es decir, ya revisados por el cardiólogo. Es la consulta que
        usa el paciente o el club para descargar el documento final.

        El join es por el par `(certificado_url.id_chequeo, cc.id)` **y**
        `(certificado_url.rut_paciente, cc.rut)`: si el admin cambió el RUT del chequeo sin
        que se propagara al certificado, la fila deja de aparecer.

        `rut_paciente` es opcional: sin él devuelve el último certificado en revisión médica
        de cualquier paciente.

        Igual que el anterior, **todas las respuestas son HTTP 200**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rut_paciente: { type: string, nullable: true, example: "21345678-9" }
            examples:
              porPaciente:
                summary: Certificado final de un paciente concreto
                value:
                  rut_paciente: "21345678-9"
              ultimoGlobal:
                summary: Sin RUT — último certificado en revisión médica de cualquier paciente
                value: {}
      responses:
        '200':
          description: Resultado de la consulta (revisa `status` en el cuerpo).
          content:
            application/json:
              examples:
                encontrado:
                  value:
                    status: 200
                    url_pdf: "http://127.0.0.1:8000/Certificado/21345678-9-1842.pdf"
                    name_pdf: "Matías-Fuentes-Rojas"
                    titulo: "Matías Fuentes Rojas"
                noEncontrado:
                  summary: El chequeo aún no llega a `REVISION MEDICA`
                  value:
                    status: 404
                    mensaje: "No se encontró un certificado con los filtros enviados"

  /certificado/validar/{rut_paciente}:
    get:
      tags: [Certificados]
      summary: Comprueba si el paciente tiene algún certificado
      operationId: validarRutCertificado
      description: |
        Un `EXISTS` sobre `certificado_url.rut_paciente`. No devuelve el certificado, solo
        si existe.

        **Siempre responde HTTP 200**, incluso en el caso "no encontrado" y en el error: el
        resultado está en el campo `status` del cuerpo.
      parameters:
        - $ref: '#/components/parameters/RutPaciente'
      responses:
        '200':
          description: Resultado de la comprobación.
          content:
            application/json:
              examples:
                existe:
                  value:
                    status: 200
                    mensaje: "El certificado existe."
                noExiste:
                  value:
                    status: 404
                    mensaje: "No se encontró un Certificado Registrado para el RUT: 21345678-9"
                error:
                  value:
                    status: 500
                    error: "Error en la consulta: SQLSTATE[HY000] [2002] Connection refused"

  /certificado/{rut_paciente}:
    get:
      tags: [Certificados]
      summary: Último certificado del paciente (fila completa)
      operationId: showCertificado
      description: |
        Devuelve la fila completa de `certificado_url` más reciente (`latest('id')`) del RUT,
        **sin sobre**.

        A diferencia de los otros endpoints de certificados, este **sí usa códigos HTTP
        reales**: 404 cuando no hay certificado y 500 en error.
      parameters:
        - $ref: '#/components/parameters/RutPaciente'
      responses:
        '200':
          description: Certificado encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificadoUrl'
              example:
                id: 981
                rut_paciente: "21345678-9"
                id_chequeo: 1842
                url_pdf: "http://127.0.0.1:8000/Certificado/21345678-9-1842.pdf"
                name_pdf: "Matías-Fuentes-Rojas"
                titulo: "Matías Fuentes Rojas"
                derivado_medico: "SI"
                created_at: "2026-09-04T14:47:55.000000Z"
                updated_at: "2026-09-04T14:47:55.000000Z"
        '404':
          description: No hay certificados para ese RUT.
          content:
            application/json:
              example:
                status: 404
                mensaje: "No se encontró certificado para el rut 21345678-9"
        '500':
          description: Error de ejecución.
          content:
            application/json:
              example:
                status: "error"
                mensaje: "SQLSTATE[HY000] [2002] Connection refused"

  # ====================================================================
  # CARGA MASIVA
  # ====================================================================

  /carga-masiva-ecg:
    post:
      tags: [Carga masiva, Certificados]
      summary: Carga masiva de certificados/ECG — FACTURA UNA VEZ POR ARCHIVO
      operationId: cargaMasivaEcg
      description: |
        Sube varios certificados de una vez. **El RUT se deduce del nombre del archivo**:
        `21345678-9.pdf` -> RUT `21345678-9`. Un archivo mal nombrado no se carga.

        Por cada archivo:

        1. Busca el **último** chequeo de ese RUT (`latest('id')`).
        2. Si no existe, agrega una entrada con `resultado: "ERROR"` y continúa con el
           siguiente.
        3. Si existe, llama a `CertificadoService::subirCertificado()`, que hace lo mismo
           que `POST /certificado/save-url`: guarda el archivo, marca `ECG FOTO` y
           **factura** `VALOR-ECG` al club.

        **Un lote de 200 archivos genera 200 cargos.** Reprocesar el lote vuelve a facturar
        todo.

        El proceso es tolerante a fallos por archivo: nunca aborta el lote completo, cada
        resultado va detallado en `procesados`. La respuesta es siempre `success: true`
        mientras la petición en sí no falle, aunque todos los archivos hayan dado error.

        Validación: `files` debe ser un array y cada elemento un archivo. `derivado_medico`
        se aplica igual a todos los archivos del lote.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: |
                    Archivos nombrados como `{rut}.pdf`, por ejemplo `21345678-9.pdf`. En el
                    formulario multipart el campo se repite como `files[]`, que es lo que
                    Laravel valida con `files` / `files.*`.
                derivado_medico:
                  type: string
                  enum: ["SI", "NO"]
                  description: Se aplica a todos los archivos del lote.
                  example: "SI"
              required: [files]
      responses:
        '200':
          description: Lote procesado (revisa `procesados` archivo por archivo).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  total: { type: integer, description: "Cantidad de archivos procesados, con o sin éxito.", example: 3 }
                  procesados:
                    type: array
                    items:
                      type: object
                      properties:
                        archivo: { type: string, example: "21345678-9.pdf" }
                        rut: { type: string, example: "21345678-9" }
                        id_chequeo:
                          description: 'Entero cuando `resultado` es `OK`; la cadena `"-"` cuando es `ERROR`.'
                          example: 1842
                        nombre: { type: string, example: "Matías Fuentes Rojas" }
                        status: { type: string, example: "ECG FOTO" }
                        resultado: { type: string, enum: ["OK", "ERROR"], example: "OK" }
                        mensaje: { type: string, example: "Archivo cargado correctamente" }
              example:
                success: true
                total: 3
                procesados:
                  - archivo: "21345678-9.pdf"
                    rut: "21345678-9"
                    id_chequeo: 1842
                    nombre: "Matías Fuentes Rojas"
                    status: "ECG FOTO"
                    resultado: "OK"
                    mensaje: "Archivo cargado correctamente"
                  - archivo: "20987654-3.pdf"
                    rut: "20987654-3"
                    id_chequeo: 1841
                    nombre: "Camila Soto Vergara"
                    status: "ECG FOTO"
                    resultado: "OK"
                    mensaje: "Archivo cargado correctamente"
                  - archivo: "99999999-9.pdf"
                    rut: "-"
                    id_chequeo: "-"
                    nombre: "-"
                    status: "-"
                    resultado: "ERROR"
                    mensaje: "No existe chequeo para el rut"
        '422':
          description: '`files` ausente o no es un array de archivos.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        '500':
          description: Error general del lote.
          content:
            application/json:
              example:
                success: false
                error: "SQLSTATE[HY000] [2002] Connection refused"

  /carga-masiva/excel:
    post:
      tags: [Carga masiva, Chequeo cardiovascular]
      summary: Importa chequeos desde una planilla Excel
      operationId: cargaMasivaExcel
      description: |
        Importa chequeos con `maatwebsite/excel` y la clase `App\Imports\ChequeoImport`,
        que recibe el `user_email` para asignar el club dueño de todas las filas
        importadas.

        Comportamiento del importador:

        - Normaliza el RUT con `preg_replace` y lo valida contra `/^\d{7,8}-[0-9kK]$/`,
          **sin verificar el dígito verificador**.
        - **Las filas con RUT inválido se descartan en silencio**: no aparecen en la
          respuesta salvo como diferencia entre las filas del archivo y `cantidad`.
        - `cantidad` es el conteo de filas efectivamente insertadas
          (`ChequeoImport::getCantInser()`).
        - `message` trae **el último error registrado** durante la importación
          (`getErrorMsg()`), no la lista completa. Puede venir vacío aunque se hayan
          descartado filas.

        Validación: `file` obligatorio con extensión `xlsx`, `xls` o `csv`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Planilla `.xlsx`, `.xls` o `.csv`.
                user_email:
                  type: string
                  format: email
                  description: Club al que se asignan todos los chequeos importados.
                  example: "club.deportivo@ergosanitas.com"
              required: [file, user_email]
      responses:
        '200':
          description: Importación terminada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, example: 200 }
                  message: { type: string, description: "Último error registrado, si lo hubo.", example: "" }
                  cantidad: { type: integer, description: "Filas insertadas.", example: 47 }
              examples:
                todoOk:
                  summary: Importación limpia
                  value:
                    status: 200
                    message: ""
                    cantidad: 47
                conDescartes:
                  summary: Hubo filas con RUT inválido
                  value:
                    status: 200
                    message: "Rut invalido: 1234-X"
                    cantidad: 44
        '400':
          description: No llegó ningún archivo.
          content:
            application/json:
              example:
                error: "No se ha enviado ningún archivo."
        '422':
          description: El archivo no es xlsx/xls/csv.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        '500':
          description: Error durante la importación.
          content:
            application/json:
              example:
                status: 500
                message: "Undefined array key \"rut\""
                cantidad: 0

  # ====================================================================
  # ELECTROCARDIOGRAMA
  # ====================================================================

  /electro-cardiograma/find-by-rut:
    post:
      tags: [Electrocardiograma]
      summary: ECG registrados de un paciente
      operationId: findEcgByRut
      description: |
        Devuelve **todas** las filas de `electro_cardiogranas` del RUT, sin sobre y sin
        ordenar.

        Si la consulta falla, el `catch` **no devuelve un error**: responde 200 con un
        objeto de placeholders (`estado_paciente: "N/A"`, `frecuencia_cardiaca_paciente: 0`,
        el resto vacío). Un cliente que solo mire el código HTTP no distingue el fallo.

        Un RUT sin ECG devuelve `[]` con 200 (no entra al `catch`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rut_paciente: { type: string, example: "21345678-9" }
              required: [rut_paciente]
            examples:
              consulta:
                value:
                  rut_paciente: "21345678-9"
      responses:
        '200':
          description: |
            Lista de ECG del paciente — **o** el objeto placeholder si la consulta falló.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/ElectroCardiograma'
                  - type: object
                    description: Placeholder devuelto por el `catch` cuando la consulta falla.
                    properties:
                      rut_paciente: { type: string }
                      estado_paciente: { type: string, example: "N/A" }
                      frecuencia_cardiaca_paciente: { type: integer, example: 0 }
                      derivacion_paciente: { type: string, example: "" }
                      observacion_paciente: { type: string, example: "" }
                      imc_paciente: { type: string, example: "" }
              examples:
                conEcg:
                  summary: Paciente con ECG cargado
                  value:
                    - id: 733
                      rut_paciente: "21345678-9"
                      id_chequeo: 1842
                      estado_paciente: "Normal"
                      frecuencia_cardiaca_paciente: "72"
                      derivacion_paciente: "No requiere"
                      observacion_paciente: "Ritmo sinusal. Sin criterios de derivación."
                      imc_paciente: "21.8"
                      created_at: "2026-09-04T15:10:02.000000Z"
                      updated_at: "2026-09-04T15:10:02.000000Z"
                sinEcg:
                  summary: Paciente sin ECG
                  value: []
                fallback:
                  summary: La consulta falló — placeholder devuelto con HTTP 200
                  value:
                    rut_paciente: "21345678-9"
                    estado_paciente: "N/A"
                    frecuencia_cardiaca_paciente: 0
                    derivacion_paciente: ""
                    observacion_paciente: ""
                    imc_paciente: ""

  /electro-cardiograma/save:
    post:
      tags: [Electrocardiograma]
      summary: Guarda el informe del cardiólogo — CAMBIA EL ESTADO Y FACTURA
      operationId: saveEcg
      description: |
        Registra la lectura del ECG. Secuencia exacta:

        1. **Borra todos los ECG previos** del `id_chequeo` (`DELETE WHERE id_chequeo = ?`).
           Solo se conserva la última lectura; no hay historial.
        2. Inserta la fila nueva en `electro_cardiogranas`.
        3. Marca el chequeo con `status = 'REVISION MEDICA'` (`firstOrFail`).
        4. Lee `params.VALOR-ECG` y llama a
           `SP_pago_mensual(hoy, club_del_chequeo, valor_ecg, 'ADD')`.

        **Cada guardado factura de nuevo**: corregir la lectura de un ECG suma otro cargo
        al mes del club. Es el segundo punto de facturación del sistema, junto con la subida
        del certificado.

        Requiere cuerpo JSON parseable a array (lee `php://input`) o devuelve 400.

        Nota: el request usa `id_paciente`, pero la columna se llama `id_chequeo` y es el id
        del chequeo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rut_paciente: { type: string, example: "21345678-9" }
                id_paciente: { type: integer, description: "Id del chequeo. Se guarda en `id_chequeo`.", example: 1842 }
                estado_paciente:
                  type: string
                  enum: [Normal, Alterado]
                  description: |
                    Alimenta el `estado_paciente` derivado de los listados
                    (`Diag. Card. - Normal` / `Diag. Card. - Alterado`).
                  example: "Normal"
                frecuencia_cardiaca_paciente: { type: string, example: "72" }
                derivacion_paciente: { type: string, example: "No requiere" }
                observacion_paciente: { type: string, example: "Ritmo sinusal. Sin criterios de derivación." }
                imc_paciente: { type: string, example: "21.8" }
              required: [rut_paciente, id_paciente, estado_paciente]
            examples:
              normal:
                summary: Trazado normal
                value:
                  rut_paciente: "21345678-9"
                  id_paciente: 1842
                  estado_paciente: "Normal"
                  frecuencia_cardiaca_paciente: "72"
                  derivacion_paciente: "No requiere"
                  observacion_paciente: "Ritmo sinusal. Sin criterios de derivación."
                  imc_paciente: "21.8"
              alterado:
                summary: Trazado alterado con derivación
                value:
                  rut_paciente: "20987654-3"
                  id_paciente: 1841
                  estado_paciente: "Alterado"
                  frecuencia_cardiaca_paciente: "104"
                  derivacion_paciente: "Cardiología infantil"
                  observacion_paciente: "Inversión de onda T más allá de V4. Requiere evaluación."
                  imc_paciente: "23.4"
      responses:
        '201':
          description: ECG guardado, chequeo en `REVISION MEDICA` y mes facturado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobreRespuestaB'
              example:
                response:
                  status: "OK"
                  mensaje: "Reserva con Exito"
        '400':
          description: El cuerpo no es un JSON válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobreRespuestaB'
              example:
                response:
                  status: "Bad Request"
                  mensaje: "Error en momento de ejecucion!!!"
        '500':
          description: |
            El `id_paciente` no existe, falta `VALOR-ECG` en `params` o falló
            `SP_pago_mensual`. Los ECG previos **ya fueron borrados** en ese punto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobreRespuestaB'
              example:
                response:
                  status: "Error en ejecucion"
                  mensaje: "No query results for model [App\\Models\\Params]."

  # ====================================================================
  # BIOIMPEDANCIA
  # ====================================================================

  /bioimpedancia/form-upload:
    post:
      tags: [Bioimpedancia, Asistentes IA]
      summary: Extrae la bioimpedancia desde la foto del informe (IA)
      operationId: bioFormUpload
      description: |
        Sube la foto de la hoja de resultados del equipo de bioimpedancia y la convierte en
        datos estructurados con **`gpt-4.1-mini`** y el prompt
        `App\IA\AnalisisBioimpedanciaPrompt`.

        Flujo:

        1. Valida `file` (`jpg`, `jpeg`, `png`, máx. ~5 MB) y `rut`.
        2. Normaliza el RUT: quita puntos y pasa `K` a `k` (`rutSave`); para el nombre del
           archivo también quita el guion.
        3. Guarda la imagen en `public/Bioimpedancia/{rut sin guion}_{HHmm}.{ext}`.
           **El nombre solo tiene precisión de minutos**: dos cargas del mismo RUT en el
           mismo minuto se sobrescriben.
        4. Busca el nombre y el club del paciente: primero en `bioimpedancia`, y si no
           existe, en `chequeo_cardiovascular` (`BioimpedanciaService::firstByRutChequeoBio`).
        5. Manda la imagen en base64 al modelo (`temperature: 0.1`, `max_tokens: 2000`).
        6. Si la IA **no** devuelve JSON válido, guarda igualmente una fila con
           `raw_json` = el texto crudo y responde **500** con
           `"IA no devolvió JSON válido"` — el registro queda creado para auditoría.
        7. Si devuelve JSON, normaliza los valores (`cleanNumber`, `formatDate`) y hace
           `updateOrCreate` **por RUT**: hay **una sola fila de bioimpedancia por paciente**,
           la última medición pisa a la anterior.

        La IA deja en `null` todo lo que no logre leer; `calidad_extraccion` indica su propia
        confianza en la lectura.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Foto o escaneo de la hoja de resultados. JPG/JPEG/PNG, máx. 5048 KB.
                rut:
                  type: string
                  description: RUT del paciente. Se normaliza en el servidor.
                  example: "21345678-9"
              required: [file, rut]
      responses:
        '200':
          description: Datos extraídos y guardados.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Datos guardados correctamente" }
                  data:
                    $ref: '#/components/schemas/Bioimpedancia'
              example:
                success: true
                message: "Datos guardados correctamente"
                data:
                  id: 314
                  rut: "21345678-9"
                  club: "club.deportivo@ergosanitas.com"
                  nombre: "Matías Fuentes Rojas"
                  sexo: "Masculino"
                  edad: 15
                  estatura_cm: 172
                  peso_kg: 64.5
                  fecha_prueba: "2026-09-04"
                  hora_prueba: "10:42"
                  puntaje_corporal: 78
                  imc: 21.8
                  grasa_corporal_pct: 14.2
                  masa_grasa_kg: 9.2
                  masa_muscular_kg: 52.1
                  masa_musculo_esqueletico_kg: 29.4
                  masa_libre_grasa_kg: 55.3
                  proteinas_kg: 11.2
                  minerales_kg: 3.1
                  agua_corporal_total_kg: 41
                  tasa_metabolica_basal_kcal: 1620
                  grasa_visceral: 3
                  grasa_subcutanea_pct: 12.4
                  edad_corporal: 14
                  smi: 9.9
                  whr: 0.82
                  peso_objetivo_kg: 65
                  control_peso_kg: 0.5
                  control_grasa_kg: -0.8
                  control_musculo_kg: 1.3
                  tipo_corporal: "Musculoso"
                  musculo_brazo_derecho_kg: 3.1
                  musculo_brazo_izquierdo_kg: 3
                  musculo_pierna_derecha_kg: 9.2
                  musculo_pierna_izquierda_kg: 9.1
                  musculo_tronco_kg: 23.4
                  grasa_brazo_derecho_kg: 0.6
                  grasa_brazo_izquierdo_kg: 0.6
                  grasa_pierna_derecha_kg: 1.5
                  grasa_pierna_izquierda_kg: 1.5
                  grasa_tronco_kg: 4.1
                  asimetrias_relevantes: "Sin asimetrías relevantes"
                  calidad_extraccion: "buena"
                  marca: "BodyPro"
                  equipo: "BodyPro Go"
                  archivo: "213456789_1042.jpg"
