  /GPT/analisis-ecg:
    post:
      tags: [Asistentes IA]
      summary: Lectura del electrocardiograma desde una imagen
      operationId: analisisEcg
      description: |
        Analiza la imagen de un ECG de 12 derivaciones con **`gpt-4.1-mini`**
        (`temperature: 0.1`, `max_tokens: 2000`) y el prompt `App\IA\AnalisisECGPrompt`.

        **Es un apoyo al tamizaje, no un informe final**: el prompt lo dice explícitamente y
        la lectura la revisa y firma después un médico. El resultado de este endpoint **no se
        guarda en la base**; para registrar la lectura oficial se usa
        `POST /electro-cardiograma/save`.

        ### Contexto clínico del prompt

        La población es de deportistas **mayoritariamente menores de 18 años**, así que el
        prompt aplica los **Criterios Internacionales de ECG en deportistas (2017)** y el
        patrón juvenil pediátrico: bradicardia sinusal, bloqueo AV de primer grado,
        repolarización precoz o inversión de onda T en V1–V3 en menores de 16 años se
        informan como **normales para esta población**, no como patología.

        ### Efecto secundario

        La imagen se guarda en `public/Electrocardiograma/{timestamp}.{ext}` **antes** de
        analizarla. La carpeta se crea si no existe.

        ### Salida

        `analisis` trae los 20 campos del contrato, todos como cadenas de texto. `raw` es la
        respuesta cruda del modelo: si el JSON viene mal formado, `analisis` queda en `null`
        y `raw` permite diagnosticarlo.

        Validación: `file` obligatorio, imagen `jpg`/`jpeg`/`png` de máximo 5 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Imagen del ECG de 12 derivaciones. JPG/JPEG/PNG, máx. 5120 KB.
              required: [file]
      responses:
        '200':
          description: Lectura del trazado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  analisis:
                    type: object
                    nullable: true
                    properties:
                      ritmo: { type: string }
                      frecuencia_cardiaca: { type: string }
                      eje_electrico: { type: string }
                      onda_p: { type: string }
                      intervalo_pr: { type: string }
                      complejo_qrs: { type: string }
                      segmento_st: { type: string }
                      onda_t: { type: string }
                      qt: { type: string }
                      qtc: { type: string }
                      hipertrofias: { type: string }
                      bloqueos: { type: string }
                      arritmias: { type: string }
                      hallazgos: { type: string, description: 'Hallazgos anormales o limítrofes; `Sin hallazgos anormales` si no hay.' }
                      conclusion: { type: string }
                      nivel_urgencia: { type: string }
                      hallazgos_normales_deportista: { type: string, description: 'Adaptaciones al entrenamiento o patrón juvenil; `Ninguno` si no hay.' }
                      calidad_imagen: { type: string, description: '`buena`, `regular`, `baja` o `no evaluable`.' }
                      limitaciones: { type: string, description: 'Qué no se pudo evaluar; `Ninguna` si no hay.' }
                      sugerencia_derivacion: { type: string, description: 'Paso siguiente; `No requiere` cuando es normal.' }
                  raw:
                    type: string
                    description: Respuesta cruda del modelo, antes del `json_decode`.
              examples:
                normal:
                  summary: Trazado normal de deportista juvenil
                  value:
                    success: true
                    analisis:
                      ritmo: "Sinusal"
                      frecuencia_cardiaca: "58 lpm"
                      eje_electrico: "+70 grados"
                      onda_p: "Morfología y duración normales"
                      intervalo_pr: "180 ms"
                      complejo_qrs: "90 ms"
                      segmento_st: "Elevación del punto J en V2-V4, compatible con repolarización precoz"
                      onda_t: "Invertida en V1-V2"
                      qt: "400 ms"
                      qtc: "410 ms"
                      hipertrofias: "Criterios de voltaje aislados de HVI"
                      bloqueos: "Bloqueo incompleto de rama derecha"
                      arritmias: "No se observan"
                      hallazgos: "Sin hallazgos anormales"
                      conclusion: "Trazado normal para un deportista de 15 años. Los hallazgos corresponden a adaptación fisiológica al entrenamiento y a patrón juvenil."
                      nivel_urgencia: "normal"
                      hallazgos_normales_deportista: "Bradicardia sinusal; repolarización precoz; bloqueo incompleto de rama derecha; criterios de voltaje aislados de HVI; inversión de onda T en V1-V2 (patrón juvenil)"
                      calidad_imagen: "buena"
                      limitaciones: "Ninguna"
                      sugerencia_derivacion: "No requiere"
                    raw: "{\n  \"ritmo\": \"Sinusal\",\n  ... }"
                alterado:
                  summary: Trazado con hallazgos que requieren derivación
                  value:
                    success: true
                    analisis:
                      ritmo: "Sinusal"
                      frecuencia_cardiaca: "88 lpm"
                      eje_electrico: "-35 grados"
                      onda_p: "Normal"
                      intervalo_pr: "110 ms"
                      complejo_qrs: "130 ms con empastamiento inicial"
                      segmento_st: "Depresión de 1 mm en cara lateral"
                      onda_t: "Invertida en V5-V6 y en cara inferior"
                      qt: "420 ms"
                      qtc: "480 ms"
                      hipertrofias: "Criterios de voltaje de HVI con alteración de la repolarización"
                      bloqueos: "No"
                      arritmias: "No se observan"
                      hallazgos: "Preexcitación ventricular (PR corto con onda delta); inversión de onda T en cara lateral e inferior; depresión del ST; QTc prolongado"
                      conclusion: "Trazado anormal para un deportista de 16 años. Los hallazgos no corresponden a adaptación fisiológica."
                      nivel_urgencia: "alto"
                      hallazgos_normales_deportista: "Ninguno"
                      calidad_imagen: "buena"
                      limitaciones: "Ninguna"
                      sugerencia_derivacion: "Derivación a cardiología infantil antes de autorizar la práctica deportiva"
                    raw: "{\n  \"ritmo\": \"Sinusal\",\n  ... }"
        '422':
          description: El archivo no es una imagen válida o supera los 5 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
              example:
                message: "The file field must be an image."
                errors:
                  file: ["The file field must be an image."]
        '500':
          description: Falló la llamada a OpenAI o la escritura de la imagen.
          content:
            application/json:
              example:
                success: false
                message: "Incorrect API key provided"

  # ====================================================================
  # PAGOS WEBPAY (TRANSBANK)
  # ====================================================================

  /transbank/web-pay-request:
    post:
      tags: [Pagos WebPay]
      summary: Crea la transacción WebPay
      operationId: webPayRequest
      description: |
        Crea la transacción contra Transbank por **HTTP crudo** (`Http::withHeaders()`),
        **sin el SDK oficial**, usando `WEBPAY_URL`, `WEBPAY_ID`, `WEBPAY_SECRET` y
        `WEBPAY_RETURN` leídos con `env()` **dentro del propio controlador** — otro motivo
        por el que `config:cache` rompe el sistema.

        Campos que arma el servidor:

        - `buy_order` = fecha `Ymd` + el nombre del servicio (ej. `20260905Chequeo`).
          **No incluye ningún identificador único**, así que dos compras del mismo servicio
          en el mismo día comparten `buy_order`.
        - `session_id` = el RUT del paciente. Así lo recupera después `WebPayResponse`.
        - `return_url` = `WEBPAY_RETURN`.

        La respuesta se devuelve **tal cual la entrega Transbank**: `token` y `url`. El
        cliente debe hacer un POST de formulario a `url` con el campo `token_ws = token`.

        ### Comportamiento ante errores

        - Si Transbank responde algo distinto de 200, devuelve 500 con
          `{"Response": {"data": "Error al intentar pagar con WebPay"}}` — nota la `R`
          mayúscula, distinta del resto de la API.
        - Si se lanza una excepción, **el controlador graba en `logs_api` y NO retorna
          nada**: el cliente recibe un cuerpo vacío con HTTP 200. Es el bug de fondo de este
          controlador.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                servicios_name:
                  type: string
                  description: Se concatena a la fecha para formar el `buy_order`.
                  example: "Chequeo"
                rut:
                  type: string
                  description: Se envía como `session_id` a Transbank.
                  example: "21345678-9"
                monto:
                  type: number
                  description: Monto en pesos chilenos, sin decimales.
                  example: 25000
              required: [servicios_name, rut, monto]
            examples:
              pago:
                value:
                  servicios_name: "Chequeo"
                  rut: "21345678-9"
                  monto: 25000
      responses:
        '200':
          description: |
            Transacción creada — **o cuerpo vacío** si hubo una excepción (el error queda
            solo en la tabla `logs_api`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, example: "01ab8f2c9d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f90" }
                  url: { type: string, format: uri, example: "https://webpay3gint.transbank.cl/webpayserver/initTransaction" }
              example:
                token: "01ab8f2c9d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f90"
                url: "https://webpay3gint.transbank.cl/webpayserver/initTransaction"
        '500':
          description: Transbank respondió con un código distinto de 200.
          content:
            application/json:
              example:
                Response:
                  data: "Error al intentar pagar con WebPay"

  /transbank/web-pay-response:
    get:
      tags: [Pagos WebPay]
      summary: Callback de retorno de WebPay
      operationId: webPayResponse
      description: |
        URL de retorno que invoca Transbank tras el pago (`WEBPAY_RETURN`). **No la llama el
        cliente directamente.**

        Flujo:

        1. Lee el token **desde `$_GET['token_ws']`**, no desde el `Request` de Laravel.
        2. Confirma la transacción con un `PUT` a `{WEBPAY_URL}/{token_ws}`.
        3. Guarda la respuesta completa en `web_pay_info` (incluido el número de tarjeta
           enmascarado que devuelve Transbank).
        4. Busca la reserva por `rut_paciente` (= `session_id`) con `firstOrFail()` y la
           marca `pagado_paciente = 'PAGADO'`.
        5. Redirige a `https://ergosanitas.com`.

        ### Puntos frágiles

        - Marca la reserva como pagada **buscando solo por RUT** (`firstOrFail`, sin ordenar):
          con varias reservas del mismo paciente, marca la primera que encuentre, no
          necesariamente la que se pagó.
        - **No valida `response_code`**: guarda y marca como `PAGADO` aunque Transbank haya
          rechazado la transacción.
        - Ante cualquier excepción graba en `logs_api` y **no devuelve nada**: el usuario ve
          una página en blanco en lugar de la redirección.
      parameters:
        - name: token_ws
          in: query
          required: true
          description: Token que envía Transbank tras el pago. Se lee de `$_GET`.
          schema:
            type: string
            example: "01ab8f2c9d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f90"
      responses:
        '302':
          description: Pago procesado. Redirección a `https://ergosanitas.com`.
          headers:
            Location:
              schema:
                type: string
              example: "https://ergosanitas.com"
        '200':
          description: |
            **Cuerpo vacío**: hubo una excepción y el error quedó registrado solo en la tabla
            `logs_api`.

  # ====================================================================
  # CORREO
  # ====================================================================

  /email/reserva-hora:
    post:
      tags: [Correo]
      summary: Envía el correo de confirmación de la reserva
      operationId: emailReservaHora
      description: |
        Busca la **última** reserva del RUT (`ORDER BY id DESC`), arma un HTML mínimo con el
        nombre y la fecha, y lo envía con `App\Mail\EmailMailable`:

        - Al `email_paciente` de la reserva.
        - **Y una copia fija a `ergosanitas@gmail.com`**, hardcodeada en el controlador.

        Son **dos envíos síncronos** (no hay cola): el request espera a que ambos terminen.

        Si el RUT no tiene reservas, `->first()` devuelve `null` y el acceso a
        `$agendaHora->nombre_paciente` sale como 500.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rut_paciente: { type: string, example: "21345678-9" }
              required: [rut_paciente]
            examples:
              envio:
                value:
                  rut_paciente: "21345678-9"
      responses:
        '201':
          description: Correos enviados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobreRespuestaB'
              example:
                response:
                  status: "OK"
                  mensaje: "Reserva con Exito"
        '500':
          description: RUT sin reservas, o fallo del transporte de correo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobreRespuestaB'
              example:
                response:
                  status: "Error en ejecucion"
                  mensaje: "Connection could not be established with host smtp.gmail.com"
