openapi: 3.0.3

info:
  title: Ergosanitas — API REST
  version: "1.0.0"
  x-generated-from: "routes/api.php — 84 endpoints"
  description: |
    API REST en **Laravel 11 / PHP 8.2** de **Ergo SaniTas SpA**: gestión de chequeos
    cardiovasculares deportivos, electrocardiogramas, bioimpedancia, certificados médicos,
    incidencias deportivas, agendamiento de horas, pagos WebPay (Transbank) y asistentes
    clínicos con OpenAI.

    Todo el proyecto se expone bajo el prefijo `/api`. No existe frontend propio.

    ---

    ## 1. Convenciones críticas antes de integrar

    ### 1.1 Conviven DOS formatos de respuesta incompatibles

    No hay un sobre canónico. Cada controlador usa el suyo y **cambiarlo rompe a los
    clientes actuales**. Los dos formatos son:

    | Formato | Forma | Controladores que lo usan |
    |---|---|---|
    | A — `success` | `{"success": true, "message": "...", "data": {...}}` | `Auth/UserController`, `Auth/GoogleAuthControlle`, `BioimpedanciaController`, `CertificadoUrlController`, `FichaClinicaController`, `FileUploadController`, `IncidenciasController`, `OpenAIController` |
    | B — `response` | `{"response": {"status": "OK", "mensaje": "..."}}` | `AgendaHorasController`, `ChequeoCardiovascularController`, `ElectroCardiogramaController`, `EmailController`, `EstadisticasController` |

    `OpenAIController` y `GoogleAuthControlle` **mezclan ambos dentro del mismo archivo**.
    Además varios endpoints devuelven directamente el array u objeto de datos, sin sobre
    alguno (`GET /chequeo-cardiovascular`, `GET /servicios`, las estadísticas por SP, etc.).

    En este contrato cada operación documenta el sobre real que devuelve, no el ideal.

    ### 1.2 Códigos HTTP poco convencionales

    - Varios errores se devuelven como **200 OK** con un `status` interno en el cuerpo
      (`GET /certificado/validar/{rut}`, `POST /certificado/path-url`,
      `POST /certificado/valida-certificado`).
    - `IncidenciasController` devuelve **201 Created** también en las lecturas (GET).
    - `PUT /chequeo-cardiovascular/{id}/{email}` devuelve un sobre plano en éxito y el
      sobre B anidado en error.
    - `WebPayController` **no devuelve respuesta** cuando falla: graba en la tabla
      `logs_api` y termina con cuerpo vacío.
    - Un servicio caído o un SP inexistente sale casi siempre como **500** con el mensaje
      crudo de la excepción (`$e->getMessage()`), a veces con `file` y `line`. No expongas
      estas respuestas al usuario final sin filtrarlas.

    ### 1.3 No hay middleware de autenticación en las rutas de negocio

    `bootstrap/app.php` no registra middleware global ni manejador de excepciones, y no
    existe `app/Http/Middleware`. **Ninguna ruta de negocio en `routes/api.php` está
    protegida.** El `user_email` y el `perfiles_id` viajan como parámetros del request, de
    modo que el filtrado por perfil descrito más abajo es una **regla de presentación, no
    un control de acceso**. La única ruta con middleware es `GET /user` (`auth:sanctum`),
    que es el ejemplo que trae Laravel.

    Coexisten tres mecanismos de autenticación:

    1. `Auth::attempt()` con sesión — login principal (`POST /auth-register`).
    2. Sanctum — solo `GET /user`.
    3. JWT (`php-open-source-saver/jwt-auth`) — configurado como guard `api` pero sin uso
       en ninguna ruta.

    ### 1.4 El RUT es la clave de negocio

    El identificador que cruza todos los dominios **no es un id numérico sino el RUT del
    paciente**: `chequeo_cardiovascular.rut`, `certificado_url.rut_paciente`,
    `bioimpedancia.rut`, `electro_cardiogranas.rut_paciente`, `agenda_horas.rut_paciente`
    y `SP_ficha_clinica`.

    - Formato esperado: `12345678-9` — 7 u 8 dígitos, guion, dígito verificador `0-9`, `k` o `K`.
    - `App\Imports\ChequeoImport` lo normaliza con `preg_replace` y lo valida contra
      `/^\d{7,8}-[0-9kK]$/`, **sin verificar el dígito verificador**. Las filas del Excel
      con RUT inválido se descartan en silencio.
    - `BioimpedanciaController` quita los puntos y pasa `K` a `k` antes de guardar.
    - Varias tablas se relacionan por el par `(rut_paciente, id_chequeo)` en vez de por
      foreign key.

    ### 1.5 Autorización por perfil (`perfiles_id`)

    Se obtiene con `UserMetadataService::getPerfilIdByEmail($user_email)` a partir del
    email que envía el cliente. Perfiles con tratamiento especial:

    | Perfil | Rol | Efecto |
    |---|---|---|
    | 1 | Administrador | Ve todo. En `PUT /chequeo-cardiovascular/{id}/{email}` es el único que puede cambiar `rut`, `user_email`, `status` y `fecha_atencion`, y el que propaga el cambio de RUT a certificados y ECG. |
    | 2 | Tester en terreno | Al crear o actualizar un chequeo fija `fecha_atencion = now()` y `status = 'Testiado'`. |
    | 3 | Club deportivo | `WHERE cc.user_email = :user_email` — solo ve sus propios registros e **ignora el filtro `selectClub`**. |
    | 5 | Paciente | Perfil que asigna `POST /login/create-user`. |
    | 6 | Médico | Solo ve derivados: join con `certificado_url` por `(rut, id_chequeo)` y `cu.derivado_medico = 'SI'`; en la búsqueda además `cc.status = 'ECG FOTO'`. |
    | otros | — | Ven todo. |

    Ese patrón está duplicado en `filterCalendar()`, `SearchChequeo()` y `ChequeoEmailAll()`:
    si cambia la regla hay que cambiarla en los tres.

    ### 1.6 Ciclo de vida del chequeo (`status`)

    Texto libre que avanza así:

    ```
    ingresado  ->  Testiado  ->  ECG FOTO  ->  REVISION MEDICA
    ```

    - `ingresado` — alta del chequeo hecha por un perfil distinto de 2.
    - `Testiado` — lo escribe el perfil 2 al crear o actualizar.
    - `ECG FOTO` — lo escriben `POST /certificado/save-url` y `POST /carga-masiva-ecg`.
    - `REVISION MEDICA` — lo escribe `POST /electro-cardiograma/save`.

    En las listas el `status` se transforma en `estado_paciente`:

    - `REVISION MEDICA` + ECG cargado -> `Diag. Card. - {estado_paciente del ECG}`
    - `REVISION MEDICA` sin ECG -> `En Rev. Cardio`
    - cualquier otro caso -> el `status` tal cual

    Para el perfil 3 el orden de la búsqueda es
    `FIELD(cc.status, 'ECG FOTO', 'REVISION MEDICA', 'Testiado', 'ingresado')`.

    ### 1.7 La subida del certificado FACTURA el mes del club

    `POST /certificado/save-url`, `POST /carga-masiva-ecg` y `POST /electro-cardiograma/save`
    hacen, además de guardar:

    1. Borran el certificado previo del par `(rut, id_chequeo)` — solo `save-url`.
    2. Marcan el chequeo (`ECG FOTO` o `REVISION MEDICA`).
    3. Leen el parámetro `VALOR-ECG` de la tabla `params`.
    4. Llaman a `SP_pago_mensual(periodo, club, valor_ecg, 'ADD')`.

    **Reintentar la subida vuelve a facturar.** Si falta la fila `VALOR-ECG` en `params`,
    el `firstOrFail()` tumba el endpoint con un 500.

    ### 1.8 Configuración de negocio en la tabla `params`

    Los valores de negocio (no de infraestructura) viven en la tabla `params` y se leen con
    `Params::where('descripcion', 'CLAVE')->firstOrFail()->valor`. Hoy solo se usa
    `VALOR-ECG`. Si un valor tarifario parece hardcodeado y ausente, búscalo ahí antes que
    en `.env`.

    ### 1.9 Almacenamiento de archivos

    Los archivos subidos van a `public/` (`public/Certificado`, `public/Logo`,
    `public/Electrocardiograma`, `public/Bioimpedancia`) mediante `$file->move()`, **no**
    al disco de storage de Laravel. Las URLs públicas se arman con `env('API_PATH_CER')` y
    `env('API_PATH_LOGO')`.

    En producción `dockerHub/docker-compose.yml` monta volúmenes para `storage/` y
    `bootstrap/cache` **pero no para `public/`**: un redeploy de `:latest` pierde los
    archivos subidos.

    ### 1.10 Procedimientos almacenados

    Buena parte de las estadísticas vive en MySQL, no en PHP. Los SP devuelven una única
    columna (`resultado_json` o `resultado`) que el servicio decodifica antes de responder.
    **Los SP no están versionados en el repo ni en las migraciones**; al cambiar su firma
    hay que actualizarlos directamente en la base de datos. Por eso la forma exacta del
    JSON de los endpoints de estadística depende del SP instalado, y en este contrato se
    modela como objeto/array libre con un ejemplo representativo.

    | SP | Endpoint que lo usa |
    |---|---|
    | `SP_estadistica_IMC` | `GET /estadisticas/estadistica-imc/{user_email}` |
    | `sp_estadistica_presion` | `GET /estadisticas/estadistica-presion/{user_email}` |
    | `SP_estadistica_hemoglucotest` | `GET /estadisticas/estadistica-hemoglucotest/{user_email}` |
    | `SP_estadistica_saturacion` | `GET /estadisticas/estadistica-saturacion/{user_email}` |
    | `SP_estado_general` | `GET /chequeo-cardiovascular/estado-general/{user_email}` |
    | `SP_estadistica_monto` | `GET /estadisticas/estadistica-pago-mensual` |
    | `SP_estadistica_monto_mdc` | `GET /estadisticas/estadistica-pago-mdc` |
    | `SP_pago_mensual` | `POST /estadisticas/pago-mensual` y la subida de certificados |
    | `SP_agenda_mensual` | `POST /estadisticas/agenda-mensual` |
    | `SP_update_pago_mensual` | `POST /estadisticas/update-pago-mensual` |
    | `SP_chequeos_prompt` | `POST /sam-assistant/as-question` |
    | `SP_chequeos_club_prompt` | `POST /sam-assistant-club/as-question` |
    | `SP_ficha_clinica` | `GET /ficha-clinica/{rut_paciente}` |
    | `SP_bioimpedacia_rut` | `GET /bioimpedancia/pdfRut/{rut_paciente}` |
    | `SP_estadistica_liga` / `_categoria` / `_lesiones` / `_parte_cuerpo` / `_lesiones_fechas` | endpoints `incidencia-deportivos/sp_*` |

    ### 1.11 Modelos de OpenAI en uso

    | Modelo | Endpoints |
    |---|---|
    | `gpt-4o-mini` | `POST /sam-assistant/as-question`, `POST /sam-assistant-club/as-question`, extracción de paciente en `PatientHelper` |
    | `gpt-4.1-mini` | `POST /GPT/analisis-ecg`, `POST /GPT/asistente-voz`, `POST /bioimpedancia/form-upload` |

    Los prompts de sistema viven como clases estáticas en `app/IA/`. Cada prompt debe vivir
    en **un solo archivo**: dos clases homónimas colisionan en el classmap optimizado que
    genera `composer install --optimize-autoloader`.

    ### 1.12 Trampas de despliegue

    - **Nunca ejecutar `php artisan config:cache`.** Varios controladores leen `env()` fuera
      de `config/`: `API_PATH_CER`, `API_PATH_LOGO`, `WEBPAY_URL|ID|SECRET|RETURN`,
      `GOOGLE_CLIENT_ID|SECRET`. Con la config cacheada devuelven `null` y se rompen
      certificados, logos, pagos y login de Google. `dockerHub/entrypoint.sh` hace
      `config:clear` en cada arranque por esto.
    - La tabla de ECG se llama **`electro_cardiogranas`** (con "n"): typo consolidado en
      producción, hay que respetarlo en las queries.
    - `GoogleAuthControlle` (sin la "r" final) y `UserUpdatePassowrd` también son typos
      consolidados; no se corrigen sin actualizar rutas y clientes.
    - Tablas sin migración: `users_metadata`, `params`, `electro_cardiogranas`,
      `pago_mensual`.
    - Rutas duplicadas en `routes/api.php`: `/user` (líneas 7 y 44) e
      `incidencia-deportivos/count-liga` (líneas 267 y 270). Laravel se queda con la última
      declaración.
    - En `routes/api.php` el orden importa: `chequeo-cardiovascular/pdf/{id}` está declarada
      antes que `chequeo-cardiovascular/{id_paciente}` a propósito.

