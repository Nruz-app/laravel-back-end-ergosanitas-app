  /estadisticas/pago-mensual:
    post:
      tags: [Estadísticas y pagos]
      summary: Registra o ajusta el cargo mensual de un club — ESCRIBE FACTURACIÓN
      operationId: pagoMensual
      description: |
        Llama directamente a `CALL SP_pago_mensual(:periodo, :user_email, :valor_ecg, :modo)`.
        Es **el mismo procedimiento que ejecutan automáticamente la subida del certificado y
        el guardado del ECG**, expuesto aquí para ajustes manuales.

        - `modo = 'ADD'` suma el valor al periodo del club (lo que hace el flujo automático).
        - Los demás modos dependen de la implementación del SP en la base, que no está
          versionada en el repo. **Verifica el código del SP antes de usar cualquier modo
          distinto de `ADD`.**

        No hay validación de los parámetros ni control de acceso: un `ADD` mal enviado
        altera la facturación del mes y hay que corregirlo a mano.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                periodo:
                  type: string
                  format: date
                  description: Fecha del periodo. El flujo automático envía `date('Y-m-d')` del día de la carga.
                  example: "2026-09-05"
                user_email:
                  type: string
                  format: email
                  description: Club al que se le carga el monto.
                  example: "club.deportivo@ergosanitas.com"
                valor_ecg:
                  type: number
                  description: Monto. El flujo automático toma `params.VALOR-ECG`.
                  example: 10000
                modo:
                  type: string
                  description: Modo de operación del SP. El flujo automático usa `ADD`.
                  example: "ADD"
              required: [periodo, user_email, valor_ecg, modo]
            examples:
              cargoManual:
                summary: Cargo manual de un ECG
                value:
                  periodo: "2026-09-05"
                  user_email: "club.deportivo@ergosanitas.com"
                  valor_ecg: 10000
                  modo: "ADD"
      responses:
        '200':
          description: Resultado del SP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoSP'
              example:
                periodo: "2026-09"
                club: "club.deportivo@ergosanitas.com"
                cantidad_ecg: 48
                monto: 480000
        '500':
          description: El SP no existe o falló.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobreRespuestaB'

  /estadisticas/delete-pago-mensual:
    post:
      tags: [Estadísticas y pagos]
      summary: Borra la facturación de un club en un periodo — DESTRUCTIVO
      operationId: deletePagoMensual
      description: |
        `DELETE FROM pago_mensual WHERE club = :user_email AND periodo = :periodo`.

        **Borrado físico y sin confirmación**: elimina el registro de facturación de ese club
        para ese periodo. No hay papelera ni log. Es el endpoint más destructivo de la API y
        **no tiene ningún control de acceso**.

        `deleted` indica cuántas filas se borraron; `0` significa que no había coincidencias
        (por ejemplo, por un formato de `periodo` distinto al almacenado).

        Ojo con el mapeo de nombres: el campo del request se llama `user_email` pero la
        columna es `club`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_email:
                  type: string
                  format: email
                  description: 'Se compara contra la columna `club`.'
                  example: "club.deportivo@ergosanitas.com"
                periodo:
                  type: string
                  description: Debe coincidir **exactamente** con el valor almacenado en la columna `periodo`.
                  example: "2026-09"
              required: [user_email, periodo]
            examples:
              borrado:
                summary: Borra la facturacion de septiembre de un club
                value:
                  user_email: "club.deportivo@ergosanitas.com"
                  periodo: "2026-09"
      responses:
        '200':
          description: Borrado ejecutado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  deleted: { type: integer, description: Filas borradas., example: 1 }
              examples:
                borrado:
                  value:
                    status: "ok"
                    deleted: 1
                sinCoincidencias:
                  value:
                    status: "ok"
                    deleted: 0
        '500':
          description: Error de ejecución.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobrePlanoB'
              example:
                status: "Error en ejecucion"
                mensaje: "SQLSTATE[42S02]: Base table or view not found: 'pago_mensual'"

  /estadisticas/agenda-mensual:
    post:
      tags: [Estadísticas y pagos]
      summary: Agenda consolidada del mes
      operationId: agendaMensual
      description: '`CALL SP_agenda_mensual(:periodo)`. Devuelve el JSON del SP sin sobre.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                periodo: { type: string, example: "2026-09" }
              required: [periodo]
            examples:
              mes:
                value:
                  periodo: "2026-09"
      responses:
        '200':
          description: Agenda del periodo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoSP'
              example:
                - fecha: "2026-09-18"
                  club: "club.deportivo@ergosanitas.com"
                  agendados: 24
                  atendidos: 21
        '500':
