  # ====================================================================
  # ASISTENTES IA
  # ====================================================================

  /sam-assistant/as-question:
    post:
      tags: [Asistentes IA]
      summary: Chat clínico sobre UN paciente
      operationId: asQuestionUseCase
      description: |
        Asistente conversacional que responde preguntas clínicas sobre un paciente concreto,
        con memoria por sesión. Usa **`gpt-4o-mini`** con `temperature: 0.2` y el prompt
        `App\IA\AsistenteChatPacientePrompt`.

        ### Flujo

        1. `OpenAIService::resolveSession()` recupera o crea la fila de `chat_sessions` por
           `sessionId`.
        2. Si la sesión **aún no tiene paciente**, intenta extraerlo del `prompt` con
           `PatientHelper::extractPatient()`: primero una regex de RUT y, si falla, una
           llamada extra a `gpt-4o-mini`.
        3. Sin paciente resuelto responde `status: "needs_identifier"` con un mensaje
           pidiendo el RUT o el nombre. **No es un error: es HTTP 200.**
        4. Con paciente, `handle()` guarda el mensaje del usuario en `chat_history` y
           recupera los **20 mensajes más antiguos** de ese paciente
           (`orderBy created_at ASC limit 20`) como contexto.
        5. `EstadisticasService::ChequeoPrompt()` (`SP_chequeos_prompt`) aporta los datos
           clínicos. Si el SP no devuelve nada, responde otra vez `needs_identifier`.
        6. Llama a OpenAI y guarda la respuesta en `chat_history` con el contexto clínico
           serializado en `context_json`.

        ### Consideraciones para el cliente

        - El `sessionId` lo genera el cliente (por ejemplo un UUID) y debe mantenerse estable
          durante la conversación.
        - El historial se guarda **por paciente**, no por sesión: dos sesiones distintas que
          hablen del mismo paciente comparten el historial.
        - Para cambiar de paciente usa `POST /sam-assistant/reset-patient`.
        - `prompt` está limitado a 500 caracteres.
        - Latencia típica de varios segundos; puede haber dos llamadas a OpenAI en el mismo
          request (extracción del paciente + respuesta).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  maxLength: 500
                  description: Pregunta del usuario. En el primer mensaje debe incluir el RUT o el nombre del paciente.
                  example: "¿Cómo está la presión del paciente 21345678-9?"
                sessionId:
                  type: string
                  description: Identificador de conversación generado por el cliente.
                  example: "9f1c2b7e-3a4d-4c88-9d2f-7a1b6c5e4d33"
              required: [prompt, sessionId]
            examples:
              primerMensaje:
                summary: Primer mensaje con el RUT
                value:
                  prompt: "¿Cómo está la presión del paciente 21345678-9?"
                  sessionId: "9f1c2b7e-3a4d-4c88-9d2f-7a1b6c5e4d33"
              seguimiento:
                summary: Mensaje de seguimiento (el paciente ya está en la sesión)
                value:
                  prompt: "¿Y su IMC está dentro de rango para su edad?"
                  sessionId: "9f1c2b7e-3a4d-4c88-9d2f-7a1b6c5e4d33"
              sinIdentificador:
                summary: Mensaje sin paciente identificable
                value:
                  prompt: "Hola, buenos días"
                  sessionId: "9f1c2b7e-3a4d-4c88-9d2f-7a1b6c5e4d33"
      responses:
        '200':
          description: |
            Respuesta del asistente **o** solicitud de identificador. Distingue ambos casos
            por la presencia del campo `status`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string, example: "9f1c2b7e-3a4d-4c88-9d2f-7a1b6c5e4d33" }
                  patient:
                    type: string
                    nullable: true
                    description: Identificador del paciente resuelto en la sesión.
                    example: "21345678-9"
                  response: { type: string, example: "La última presión registrada es 120/70 mmHg..." }
                  status:
                    type: string
                    nullable: true
                    description: Solo aparece cuando falta el paciente (`needs_identifier`).
                    example: "needs_identifier"
              examples:
                conRespuesta:
                  summary: Paciente resuelto — respuesta del asistente
                  value:
                    sessionId: "9f1c2b7e-3a4d-4c88-9d2f-7a1b6c5e4d33"
                    patient: "21345678-9"
                    response: "La última presión registrada de Matías Fuentes Rojas (04/09/2026) es 120/70 mmHg, dentro de rango normal para un deportista de 15 años. La saturación fue 98% y el pulso 68 lpm."
                necesitaIdentificador:
                  summary: No se pudo resolver el paciente
                  value:
                    sessionId: "9f1c2b7e-3a4d-4c88-9d2f-7a1b6c5e4d33"
                    patient: null
                    status: "needs_identifier"
                    response: "Bienvenido a Ergosanitas Para Ayudarte Necesito Que\n                Me Indiques El RUT o El Nombre Del Paciente."
                sinDatosClinicos:
                  summary: El SP no encontró datos del paciente
                  value:
                    sessionId: "9f1c2b7e-3a4d-4c88-9d2f-7a1b6c5e4d33"
                    patient: null
                    status: "needs_identifier"
                    response: "No encontré información del paciente. Por favor indícame el RUT o confirma el nombre."
        '400':
          description: Error de negocio que contiene el texto "Debes ingresar".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorThrowable'
        '500':
          description: |
            Falla de OpenAI, del SP o de validación (la `ValidationException` **no** se
            captura por separado en este controlador). **Filtra `file` y `line` antes de
            mostrar el error.**
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorThrowable'
              example:
                error: "Undefined property: stdClass::$resultado_json"
                line: 118
                file: "/var/www/html/app/Http/Controllers/OpenAIController.php"

  /sam-assistant/reset-patient:
    post:
      tags: [Asistentes IA]
      summary: Suelta el paciente de la sesión de chat
      operationId: resetPatient
      description: |
        Pone `chat_sessions.patient_identifier = null` para que la siguiente pregunta vuelva
        a pedir el identificador del paciente.

        **No borra el historial** de `chat_history`: como el historial se guarda por
        paciente, al volver a ese paciente se recupera la conversación anterior.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId: { type: string, example: "9f1c2b7e-3a4d-4c88-9d2f-7a1b6c5e4d33" }
              required: [sessionId]
            examples:
              reset:
                value:
                  sessionId: "9f1c2b7e-3a4d-4c88-9d2f-7a1b6c5e4d33"
      responses:
        '200':
          description: Paciente liberado.
          content:
            application/json:
              example:
                ok: true
                message: "Patient context reset"
        '404':
          description: No existe una sesión con ese `sessionId`.
          content:
            application/json:
              example:
                ok: false
                message: "Session not found"
        '422':
          description: Falta `sessionId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'

  /sam-assistant-club/as-question:
    post:
      tags: [Asistentes IA]
      summary: Chat sobre TODOS los pacientes de un club
      operationId: asQuestionClubUseCase
      description: |
        Asistente conversacional a nivel de club: responde preguntas sobre el conjunto de
        pacientes **en revisión médica** de ese club. Usa **`gpt-4o-mini`** con
        `temperature: 0.2` y el prompt `App\IA\AsistenteChatClubPrompt`.

        ### Semántica del campo `search`

        Es el detalle más importante de la integración. `search` filtra los pacientes que se
        mandan al modelo y **se persiste en la sesión** (`chat_club_sessions.search_actual`):

        | Cómo se envía | Efecto |
        |---|---|
        | El campo **no viene** en el JSON | Se conserva el `search_actual` que ya tenía la sesión. |
        | `"search": ""` (cadena vacía) | **Reset explícito**: `search_actual = null`, el chat pasa a hablar de todo el club. |
        | `"search": "Fuentes"` | Se guarda ese filtro y el chat queda acotado a ese paciente. |

        ### Datos que recibe el modelo

        `SP_chequeos_club_prompt(search, club)` devuelve los pacientes. El servicio:

        - **Invierte la presión arterial** antes de mandarla al modelo: el SP la arma como
          `CONCAT(presionArterial, '/', presion_sistolica)`, es decir
          diastólica/sistólica (`"70/130"`), y se corrige a `"130/70"` para que el modelo no
          lea una presión normal como una crisis hipertensiva.
        - **Trunca en 120 pacientes** (`ClubAssistantService::MAX_PACIENTES`). El prompt
          recibe el total real y una marca de truncado, para que el asistente avise cuando
          está viendo solo una parte.

        Si el SP no devuelve pacientes, responde `status: "sin_datos"` con HTTP 200.

        ### Historial

        Se guarda en `chat_club_history` **por `session_id`** (no por club) y se recuperan
        los 20 mensajes más recientes, desempatando por `id` cuando comparten `created_at`.

        Este es el único controlador que **captura `ValidationException` por separado** y
        responde 422 correctamente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Club sobre el que se conversa.
                  example: "club.deportivo@ergosanitas.com"
                prompt:
                  type: string
                  maxLength: 500
                  example: "¿Cuántos pacientes tienen la presión alterada?"
                sessionId:
                  type: string
                  example: "4b8e1d90-77aa-42c3-93d1-0f5e2a6c8b11"
                search:
                  type: string
                  maxLength: 255
                  nullable: true
                  description: |
                    Filtro de paciente. Omitir para conservar el actual, `""` para resetear,
                    o un texto para acotar.
                  example: "Fuentes"
              required: [email, prompt, sessionId]
            examples:
              todoElClub:
                summary: Pregunta sobre todo el club (sin enviar `search`)
                value:
                  email: "club.deportivo@ergosanitas.com"
                  prompt: "¿Cuántos pacientes tienen la presión alterada?"
                  sessionId: "4b8e1d90-77aa-42c3-93d1-0f5e2a6c8b11"
              acotarPaciente:
                summary: Acotar la conversación a un paciente
                value:
                  email: "club.deportivo@ergosanitas.com"
                  prompt: "¿Cuál fue su última saturación?"
                  sessionId: "4b8e1d90-77aa-42c3-93d1-0f5e2a6c8b11"
                  search: "Fuentes"
              resetFiltro:
                summary: Reset explícito del filtro (search vacío)
                value:
                  email: "club.deportivo@ergosanitas.com"
                  prompt: "Volvamos a ver todo el club"
                  sessionId: "4b8e1d90-77aa-42c3-93d1-0f5e2a6c8b11"
                  search: ""
      responses:
        '200':
          description: Respuesta del asistente, o `sin_datos` si el filtro no arrojó pacientes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string, example: "4b8e1d90-77aa-42c3-93d1-0f5e2a6c8b11" }
                  club: { type: string, format: email, example: "club.deportivo@ergosanitas.com" }
                  search:
                    type: string
                    nullable: true
                    description: Filtro efectivo tras resolver la sesión.
                    example: "Fuentes"
                  response: { type: string }
                  status:
                    type: string
                    nullable: true
                    description: Solo aparece cuando no hay pacientes (`sin_datos`).
                    example: "sin_datos"
              examples:
                conDatos:
                  summary: Respuesta normal
                  value:
                    sessionId: "4b8e1d90-77aa-42c3-93d1-0f5e2a6c8b11"
                    club: "club.deportivo@ergosanitas.com"
                    search: null
                    response: "De los 84 pacientes en revisión médica del club, 7 presentan presión arterial sobre el rango esperado para su edad. El más alto es Camila Soto Vergara con 138/88 mmHg."
                sinDatos:
                  summary: El filtro no arrojó pacientes
                  value:
                    sessionId: "4b8e1d90-77aa-42c3-93d1-0f5e2a6c8b11"
                    club: "club.deportivo@ergosanitas.com"
                    search: "Perez"
                    status: "sin_datos"
                    response: "No encontré chequeos en revisión médica para ese club con ese filtro."
        '422':
          description: Validación fallida (capturada explícitamente en este controlador).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
              example:
                message: "Los datos enviados no son válidos."
                errors:
                  email: ["The email field must be a valid email address."]
                  prompt: ["The prompt field must not be greater than 500 characters."]
        '500':
          description: |
            Falla de OpenAI o del SP. **Filtra `file` y `line` antes de mostrar el error.**
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorThrowable'
              example:
                error: "SQLSTATE[42000]: PROCEDURE ergosanitas.SP_chequeos_club_prompt does not exist"
                line: 54
                file: "/var/www/html/app/Services/ClubAssistantService.php"

  /sam-assistant-club/reset-search:
    post:
      tags: [Asistentes IA]
      summary: Limpia el filtro de paciente de la sesión de club
      operationId: resetSearch
      description: |
        Pone `chat_club_sessions.search_actual = null`. Equivale a enviar `"search": ""` en
        la siguiente pregunta.

        **No borra el historial** de `chat_club_history`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId: { type: string, example: "4b8e1d90-77aa-42c3-93d1-0f5e2a6c8b11" }
              required: [sessionId]
            examples:
              reset:
                value:
                  sessionId: "4b8e1d90-77aa-42c3-93d1-0f5e2a6c8b11"
      responses:
        '200':
          description: Filtro reiniciado.
          content:
            application/json:
              example:
                ok: true
                message: "Filtro de paciente reiniciado"
        '404':
          description: No existe una sesión con ese `sessionId`.
          content:
            application/json:
              example:
                ok: false
                message: "Sesión no encontrada"
        '422':
          description: Falta `sessionId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        '500':
          description: Error inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorThrowable'

  /GPT/asistente-voz:
    post:
      tags: [Asistentes IA]
      summary: Convierte un dictado por voz en el formulario del chequeo
      operationId: asistenteVoz
      description: |
        Recibe la **transcripción** de un dictado hecho en terreno y devuelve el formulario
        del chequeo estructurado. Usa **`gpt-4.1-mini`** con `temperature: 0.1` y
        `max_tokens: 1500`, con el prompt `App\IA\AsistenteVozPrompt`.

        **Este endpoint no transcribe audio**: recibe texto ya transcrito. La transcripción
        la hace el cliente.

        ### Contrato de la salida

        `data` trae **siempre los 26 campos**, en el mismo orden, aunque estén vacíos. Sus
        nombres coinciden con las columnas de `chequeo_cardiovascular` y
        `electro_cardiogranas`, de modo que la respuesta se puede enviar casi tal cual a
        `POST /chequeo-cardiovascular`.

        Reglas que aplica el prompt:

        - Solo extrae lo dicho **explícitamente**: no infiere la edad desde la fecha de
          nacimiento, no calcula el IMC, no supone el sexo por el nombre.
        - Campo no dictado -> `""` (cadena vacía). La excepción es
          `frecuencia_cardiaca_paciente`, que va a `null`.
        - Si el profesional se corrige en voz alta, vale **siempre el último valor**.
        - Normaliza unidades: estatura a metros con punto decimal, RUT a `12345678-K`,
          fechas a `YYYY-MM-DD`.
        - Lo ininteligible se copia en `observacion_paciente` en vez de inventarse.

        Si el modelo no devuelve JSON válido, responde **500** con el texto crudo en
        `raw_response` para poder diagnosticar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  description: Transcripción del dictado.
