# Sin seguridad por defecto: NO es una omisión de este documento, es el estado real de
# la API. Ninguna ruta de negocio lleva middleware de autenticación (ver "1.3" arriba).
# La única operación que declara seguridad es GET /user, que la sobrescribe.
security: []

servers:
  - url: http://127.0.0.1:8000/api
    description: Desarrollo local (php artisan serve)
  - url: http://localhost:6162/api
    description: Docker Compose local (nginx en el puerto 6162)
  - url: https://api.ergosanitas.com/api
    description: Producción (ajustar al host real del despliegue)

tags:
  - name: Autenticación y usuarios
    description: |
      Login por email/password con sesión, login con Google, alta de usuarios, logo del
      club y gestión de la clave `ergo_pass`. Los usuarios viven en DOS tablas: `users`
      (Laravel, password hasheada con bcrypt) y `users_metadata` (perfil, logo, rut,
      `ergo_pass` y **una copia en claro de la contraseña**). `UserMetadataService`
      escribe en ambas y deben mantenerse sincronizadas.
  - name: Servicios
    description: Catálogo de servicios y precios; alimenta la agenda y el pago WebPay.
  - name: Agenda de horas
    description: Reserva de horas de pacientes contra un servicio del catálogo.
  - name: Chequeo cardiovascular
    description: |
      Dominio central. Alta, edición, búsqueda, filtrado por perfil y exportación a PDF y
      Word del chequeo cardiovascular deportivo.
  - name: Electrocardiograma
    description: |
      Lectura del ECG por el cardiólogo. Guardar el informe mueve el chequeo a
      `REVISION MEDICA` y **factura** el valor `VALOR-ECG` al club.
  - name: Certificados
    description: |
      Subida y consulta de los certificados/ECG en PDF. Subir un certificado marca el
      chequeo como `ECG FOTO` y **factura** el mes del club.
  - name: Bioimpedancia
    description: |
      Extracción por IA de la hoja de resultados del equipo de bioimpedancia, listados y
      certificado en PDF.
  - name: Ficha clínica
    description: Ficha clínica consolidada del paciente, armada íntegramente por `SP_ficha_clinica`.
  - name: Juego de cartas
    description: |
      Convierte a cada paciente de un club en una "carta" con cuatro atributos comparables
      0-100, puntaje, estrellas, badge clínico y barra de completitud. Todo se calcula al
      vuelo en `SP_juego_cartas_club`; los umbrales y colores viven en la tabla
      `juego_niveles` y el catálogo de atributos en `juego_atributos`.
  - name: Incidencias deportivas
    description: Registro de lesiones deportivas y sus estadísticas por liga, categoría y parte del cuerpo.
  - name: Estadísticas y pagos
    description: Estadísticas clínicas por club y facturación mensual (tabla `pago_mensual`).
  - name: Asistentes IA
    description: |
      Asistente clínico por paciente, asistente por club, asistente de voz para digitación
      y lectura de ECG por imagen. Todos usan OpenAI.
  - name: Carga masiva
    description: Importación de chequeos desde Excel y carga masiva de ECG en PDF.
  - name: Pagos WebPay
    description: |
      Integración con Transbank por HTTP crudo, **sin el SDK oficial**. Es el único dominio
      que persiste errores (tabla `logs_api`) y no devuelve respuesta al fallar.
  - name: Correo
    description: Envío del correo de confirmación de reserva de hora.
  - name: Utilidades
    description: Health checks y comandos operativos expuestos por HTTP.

components:

  securitySchemes:
    sanctumSession:
      type: apiKey
      in: cookie
      name: laravel_session
      description: |
        Cookie de sesión que emite `Auth::attempt()` en `POST /auth-register`. Solo la usa
        `GET /user` mediante el middleware `auth:sanctum`. **Ninguna otra ruta la exige.**
    sanctumToken:
      type: http
      scheme: bearer
      description: |
        Token personal de Sanctum (`personal_access_tokens`). Aplicable a `GET /user`. El
        proyecto no expone un endpoint para emitirlo.

  parameters:

    RutPaciente:
      name: rut_paciente
      in: path
      required: true
      description: RUT del paciente en formato `12345678-9` (sin puntos, con guion).
      schema:
        type: string
        pattern: '^\d{7,8}-[0-9kK]$'
        example: "21345678-9"

    IdPaciente:
      name: id_paciente
      in: path
      required: true
      description: |
        Identificador autoincremental del chequeo (`chequeo_cardiovascular.id`). Ojo: el
        nombre del parámetro dice "paciente" pero es el id del **chequeo**.
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 1842

    UserEmailPath:
      name: user_email
      in: path
      required: true
      description: |
        Email del usuario que ejecuta la consulta. Determina el `perfiles_id` y, con él, el
        filtrado de los datos. Debe ir URL-encoded (`@` -> `%40`) cuando viaja en la ruta.
      schema:
        type: string
        format: email
        example: "club.deportivo@ergosanitas.com"

    PerfilPath:
      name: perfil
      in: path
      required: true
      description: |
        Id del perfil en la tabla `perfiles`. 1 administrador, 2 tester, 3 club deportivo,
        5 paciente, 6 médico.
      schema:
        type: integer
        enum: [1, 2, 3, 4, 5, 6]
        example: 3

  schemas:

    # ------------------------------------------------------------------
    # Sobres de respuesta
    # ------------------------------------------------------------------

    SobreExitoA:
      type: object
      description: Formato A — el que usan los controladores "modernos".
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Datos guardados correctamente"
        data:
          description: Carga útil; su forma depende del endpoint. Puede ser `null`.
      required: [success]

    SobreErrorA:
      type: object
      description: |
        Formato A de error. Se devuelve con status **500** aunque la causa sea del cliente.
        `error` trae el mensaje crudo de la excepción PHP.
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Error procesando IA"
        error:
          type: string
          example: "SQLSTATE[42000]: Syntax error or access violation: 1305 PROCEDURE ergosanitas.SP_ficha_clinica does not exist"
      required: [success, message]

    SobreRespuestaB:
      type: object
      description: Formato B — el que usan los controladores "antiguos".
      properties:
        response:
          type: object
          properties:
            status:
              type: string
              description: '`OK`, `Bad Request` o `Error en ejecucion`.'
              example: "OK"
            mensaje:
              type: string
              example: "Reserva con Exito"
          required: [status, mensaje]
      required: [response]

    SobrePlanoB:
      type: object
      description: |
        Variante del formato B sin la clave `response`. La usan `LikeChequeo`,
        `FilterCalendar`, `SearchChequeo`, `deleteById` y `Update` en su rama de éxito.
      properties:
        status:
          type: string
          example: "OK"
        mensaje:
          type: string
          example: "Modificado con exito"
      required: [status, mensaje]

    ErrorThrowable:
      type: object
      description: |
        Error de los controladores de IA. **Filtra `file` y `line` antes de mostrarlo al
        usuario final: revelan rutas del servidor.**
      properties:
        error:
          type: string
          example: "Undefined property: stdClass::$resultado_json"
        line:
          type: integer
          example: 118
        file:
          type: string
          example: "/var/www/html/app/Http/Controllers/OpenAIController.php"
      required: [error]

    ErrorValidacion:
      type: object
      description: |
        Respuesta estándar de `$request->validate()` de Laravel cuando la petición trae
        `Accept: application/json`. **Solo `ClubAssistantController` la captura de forma
        explícita**; en el resto de los controladores la `ValidationException` es atrapada
        por el `catch (\Exception)` y sale como 500.
      properties:
        message:
          type: string
          example: "Los datos enviados no son válidos."
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            prompt: ["El campo prompt es obligatorio."]
      required: [message, errors]

    # ------------------------------------------------------------------
    # Usuarios
    # ------------------------------------------------------------------

    UsuarioAutenticado:
      type: object
      description: Datos del usuario que devuelve el login. Combina `users` y `users_metadata`.
      properties:
        user_id:
          type: integer
          description: '`users_metadata.id` — NO es `users.id`.'
          example: 47
        user_email:
          type: string
          format: email
          example: "club.deportivo@ergosanitas.com"
        user_name:
          type: string
          example: "Club Deportivo Municipal"
        user_perfil:
          type: string
          description: Nombre del perfil resuelto por la relación `perfiles`.
          example: "Club Deportivo"
        user_logo:
          type: string
          nullable: true
          description: URL pública del logo, armada con `env('API_PATH_LOGO')`.
          example: "http://127.0.0.1:8000/Logo/club.deportivo@ergosanitas.com_66d0f1a3b9c2e.png"
        rut_paciente:
          type: string
          nullable: true
          description: Solo viene poblado para el perfil 5 (paciente).
          example: null

    RespuestaLogin:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Inicio de sesión exitoso"
        user:
          $ref: '#/components/schemas/UsuarioAutenticado'

    UsuarioListado:
      type: object
      description: Fila de `users_metadata` filtrada por perfil y `status = 'S'`.
      properties:
        users_id:
          type: integer
          example: 47
        user_email:
          type: string
          format: email
          example: "club.deportivo@ergosanitas.com"
        user_name:
          type: string
          example: "Club Deportivo Municipal"

    # ------------------------------------------------------------------
    # Servicios y agenda
    # ------------------------------------------------------------------

    Servicio:
      type: object
      properties:
        id:
          type: integer
          example: 3
        nombre:
          type: string
          example: "Chequeo Cardiovascular Deportivo"
        precio:
          type: number
          format: double
          example: 25000
        descripcion:
          type: string
          example: "Evaluación preparticipativa con ECG y certificado médico"
        activo:
          type: string
          description: '`s` si el servicio está publicado.'
          example: "s"
        created_at:
          type: string
          format: date-time
          example: "2025-03-11T14:02:31.000000Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-03-11T14:02:31.000000Z"

    AgendaHora:
      type: object
      properties:
        id:
          type: integer
          example: 512
        nombre_paciente:
          type: string
          example: "Matías Fuentes Rojas"
        rut_paciente:
          type: string
          example: "21345678-9"
        edad_paciente:
          type: string
          example: "15"
        direccion_paciente:
          type: string
          example: "Av. Los Carrera 1450, Depto 32"
        email_paciente:
          type: string
          format: email
          example: "apoderado.fuentes@gmail.com"
        celular_paciente:
          type: string
          example: "+56912345678"
        sexo_paciente:
          type: string
          example: "Masculino"
        servicios_id:
          type: integer
          description: Resuelto en el servidor a partir de `servicios_name`.
          example: 3
        comuna_paciente:
          type: string
          example: "Rancagua"
        pagado_paciente:
          type: string
          description: '`PENDIENTE` al crear; pasa a `PAGADO` cuando WebPay confirma.'
          example: "PENDIENTE"
        fecha_reserva_paciente:
          type: string
          description: Texto libre; el cliente envía fecha y hora en el formato que use.
          example: "2026-09-18 10:30"
        created_at:
          type: string
          format: date-time
          description: |
            Solo viene en la respuesta de `POST /agenda-horas`. **`GET /agenda-horas` no lo
            incluye**: el controlador arma el array campo por campo y omite las marcas de
            tiempo.
          example: "2026-09-05T12:10:44.000000Z"
        updated_at:
          type: string
          format: date-time
          description: 'Igual que `created_at`: ausente en `GET /agenda-horas`.'
          example: "2026-09-05T12:10:44.000000Z"

    # ------------------------------------------------------------------
    # Chequeo cardiovascular
    # ------------------------------------------------------------------

    ChequeoCardiovascular:
      type: object
      description: |
        Fila completa de `chequeo_cardiovascular`. Casi todas las columnas son `VARCHAR`
        en la base: los valores numéricos viajan como texto.
      properties:
        id:
          type: integer
          example: 1842
        nombre:
          type: string
          description: Se guarda con `ucwords(strtolower(trim(...)))`.
          example: "Matías Fuentes Rojas"
        rut:
          type: string
          example: "21345678-9"
        edad:
          type: string
          example: "15"
        estatura:
          type: string
          description: Metros con punto decimal. La coma se reemplaza por punto al guardar.
          example: "1.72"
        peso:
          type: string
          description: Kilogramos.
          example: "64.5"
        hemoglucotest:
          type: string
          description: Glicemia capilar en mg/dL.
          example: "92"
        pulso:
          type: string
          description: Pulso en reposo (lpm).
          example: "68"
        presionArterial:
          type: string
          description: |
            **Guarda la DIASTÓLICA**, pese al nombre. `SP_chequeos_club_prompt` arma la
            presión como `CONCAT(presionArterial, '/', presion_sistolica)` y el servicio del
            asistente por club invierte los componentes antes de mandarlos al modelo.
          example: "70"
        presion_sistolica:
          type: string
          example: "120"
        saturacionOxigeno:
          type: string
          description: Saturación en porcentaje.
          example: "98"
        temperatura:
          type: string
          example: "36.5"
        imc_paciente:
          type: string
          example: "21.8"
        sexo_paciente:
          type: string
          example: "Masculino"
        division_paciente:
          type: string
          description: Categoría deportiva.
          example: "Sub 17"
        medio_pago_paciente:
          type: string
          example: "Efectivo"
        email_paciente:
          type: string
          format: email
          nullable: true
          example: "apoderado.fuentes@gmail.com"
        fechaNacimiento:
          type: string
          example: "2010-04-22"
        enfermedadesCronicas:
          type: string
          description: Default `No Presenta` cuando llega vacío.
          example: "No Presenta"
        medicamentosDiarios:
          type: string
          description: Default `No Presenta` cuando llega vacío.
          example: "No Presenta"
        sistemaOsteoarticular:
          type: string
          description: Default `Sin Alteraciones` cuando llega vacío.
          example: "Sin Alteraciones"
        sistemaCardiovascular:
          type: string
          description: Default `Sin Alteraciones` cuando llega vacío.
          example: "Sin Alteraciones"
        enfermedadesAnteriores:
          type: string
          description: Default `Sin Alteraciones` cuando llega vacío.
          example: "Sin Alteraciones"
        Recuperacion:
          type: string
          description: Default `Sin Alteraciones`. Nota la mayúscula inicial del campo.
          example: "Sin Alteraciones"
        gradoIncidenciaPosterio:
          type: string
          description: Default `Sin Alteraciones`. El nombre viene truncado en la base.
          example: "Sin Alteraciones"
        status:
          type: string
          enum: [ingresado, Testiado, "ECG FOTO", "REVISION MEDICA"]
          example: "REVISION MEDICA"
        user_email:
          type: string
          format: email
          description: Club dueño del chequeo. Es la clave del filtrado por perfil 3 y de la facturación.
          example: "club.deportivo@ergosanitas.com"
        user_email_update:
          type: string
          format: email
          nullable: true
          description: Último usuario que editó el registro (llega como `user_email_perfil`).
          example: "tester.terreno@ergosanitas.com"
        fecha_atencion:
          type: string
          nullable: true
          description: |
            En la tabla es `datetime`, pero en las listas se devuelve formateada como
            `dd/mm/YYYY`.
          example: "04/09/2026"
        fileStatus:
          type: string
          nullable: true
          example: "OK"
        fileName:
          type: string
          nullable: true
          example: "1757001234.jpg"
        created_at:
          type: string
          description: En las listas se devuelve formateada como `dd/mm/YYYY`.
          example: "03/09/2026"
        updated_at:
          type: string
          format: date-time
          example: "2026-09-04T13:22:10.000000Z"

    ChequeoConEstado:
      description: |
        Chequeo enriquecido con el último ECG (`electro_cardiogranas`). Es lo que devuelven
        los listados: además de las columnas de `chequeo_cardiovascular`, agrega el estado
        derivado y los datos del ECG con `'-'` como valor por defecto.
      allOf:
        - $ref: '#/components/schemas/ChequeoCardiovascular'
        - type: object
          properties:
            estado_paciente:
              type: string
              description: |
                `Diag. Card. - Normal` / `Diag. Card. - Alterado` cuando hay ECG,
                `En Rev. Cardio` cuando está en revisión sin ECG, o el `status` tal cual.
              example: "Diag. Card. - Normal"
            frecuencia_cardiaca_paciente:
              type: string
              example: "72"
            derivacion_paciente:
              type: string
              example: "No requiere"
            observacion_paciente:
              type: string
              example: "Trazado dentro de límites normales para deportista juvenil."

    # ------------------------------------------------------------------
    # ECG y certificados
    # ------------------------------------------------------------------

    ElectroCardiograma:
      type: object
      description: Fila de `electro_cardiogranas` (nombre con "n", typo consolidado).
      properties:
        id:
          type: integer
          example: 733
        rut_paciente:
          type: string
          example: "21345678-9"
        id_chequeo:
          type: integer
          description: Referencia lógica a `chequeo_cardiovascular.id`, sin foreign key.
          example: 1842
        estado_paciente:
          type: string
          enum: [Normal, Alterado]
          example: "Normal"
        frecuencia_cardiaca_paciente:
          type: string
          example: "72"
        derivacion_paciente:
          type: string
          example: "No requiere"
        observacion_paciente:
          type: string
          example: "Ritmo sinusal. Sin criterios de derivación."
        imc_paciente:
          type: string
          example: "21.8"
        created_at:
          type: string
          format: date-time
          example: "2026-09-04T15:10:02.000000Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-09-04T15:10:02.000000Z"

    CertificadoUrl:
      type: object
      description: Fila de `certificado_url`.
      properties:
        id:
          type: integer
          example: 981
        rut_paciente:
          type: string
          example: "21345678-9"
        id_chequeo:
          type: integer
          example: 1842
        url_pdf:
          type: string
          format: uri
          description: '`env(''API_PATH_CER'') . ''/'' . {rut}-{id_chequeo}.{ext}`'
          example: "http://127.0.0.1:8000/Certificado/21345678-9-1842.pdf"
        name_pdf:
          type: string
          description: Nombre del paciente con los espacios cambiados por guiones.
          example: "Matías-Fuentes-Rojas"
        titulo:
          type: string
          example: "Matías Fuentes Rojas"
        derivado_medico:
          type: string
          enum: ["SI", "NO"]
          description: '`SI` hace visible el chequeo para el perfil 6 (médico).'
          example: "SI"
        created_at:
          type: string
          format: date-time
          example: "2026-09-04T14:47:55.000000Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-09-04T14:47:55.000000Z"

    # ------------------------------------------------------------------
    # Bioimpedancia
    # ------------------------------------------------------------------

    Bioimpedancia:
      type: object
      description: |
        Fila de `bioimpedancia`. Los campos los extrae la IA desde la foto de la hoja de
        resultados del equipo (`AnalisisBioimpedanciaPrompt`) y los normaliza
        `BioimpedanciaService::mapBioimpedancia()`. Cualquier valor no legible queda en
        `null`.
      properties:
        id: { type: integer, example: 314 }
        rut: { type: string, example: "21345678-9" }
        club: { type: string, format: email, nullable: true, example: "club.deportivo@ergosanitas.com" }
        nombre: { type: string, nullable: true, example: "Matías Fuentes Rojas" }
        sexo: { type: string, nullable: true, example: "Masculino" }
        edad: { type: integer, nullable: true, example: 15 }
        estatura_cm: { type: number, nullable: true, example: 172 }
        peso_kg: { type: number, nullable: true, example: 64.5 }
        fecha_prueba: { type: string, format: date, nullable: true, example: "2026-09-04" }
        hora_prueba: { type: string, nullable: true, example: "10:42" }
        puntaje_corporal: { type: number, nullable: true, example: 78 }
        imc: { type: number, nullable: true, example: 21.8 }
        grasa_corporal_pct: { type: number, nullable: true, example: 14.2 }
        masa_grasa_kg: { type: number, nullable: true, example: 9.2 }
        masa_muscular_kg: { type: number, nullable: true, example: 52.1 }
        masa_musculo_esqueletico_kg: { type: number, nullable: true, example: 29.4 }
        masa_libre_grasa_kg: { type: number, nullable: true, example: 55.3 }
        proteinas_kg: { type: number, nullable: true, example: 11.2 }
        minerales_kg: { type: number, nullable: true, example: 3.1 }
        agua_corporal_total_kg: { type: number, nullable: true, example: 41 }
        tasa_metabolica_basal_kcal: { type: integer, nullable: true, example: 1620 }
        grasa_visceral: { type: number, nullable: true, example: 3 }
        grasa_subcutanea_pct: { type: number, nullable: true, example: 12.4 }
        edad_corporal: { type: integer, nullable: true, example: 14 }
        smi: { type: number, nullable: true, description: "Índice de masa musculoesquelética.", example: 9.9 }
        whr: { type: number, nullable: true, description: "Relación cintura/cadera.", example: 0.82 }
        peso_objetivo_kg: { type: number, nullable: true, example: 65 }
        control_peso_kg: { type: number, nullable: true, example: 0.5 }
        control_grasa_kg: { type: number, nullable: true, example: -0.8 }
        control_musculo_kg: { type: number, nullable: true, example: 1.3 }
        tipo_corporal: { type: string, nullable: true, example: "Musculoso" }
        musculo_brazo_derecho_kg: { type: number, nullable: true, example: 3.1 }
        musculo_brazo_izquierdo_kg: { type: number, nullable: true, example: 3 }
        musculo_pierna_derecha_kg: { type: number, nullable: true, example: 9.2 }
        musculo_pierna_izquierda_kg: { type: number, nullable: true, example: 9.1 }
        musculo_tronco_kg: { type: number, nullable: true, example: 23.4 }
        grasa_brazo_derecho_kg: { type: number, nullable: true, example: 0.6 }
        grasa_brazo_izquierdo_kg: { type: number, nullable: true, example: 0.6 }
        grasa_pierna_derecha_kg: { type: number, nullable: true, example: 1.5 }
        grasa_pierna_izquierda_kg: { type: number, nullable: true, example: 1.5 }
        grasa_tronco_kg: { type: number, nullable: true, example: 4.1 }
        asimetrias_relevantes: { type: string, nullable: true, example: "Sin asimetrías relevantes" }
        calidad_extraccion: { type: string, nullable: true, description: "Autoevaluación de la IA sobre la legibilidad del documento.", example: "buena" }
        marca: { type: string, nullable: true, example: "BodyPro" }
        equipo: { type: string, nullable: true, example: "BodyPro Go" }
        archivo: { type: string, nullable: true, description: "Nombre del archivo guardado en `public/Bioimpedancia`.", example: "213456789_1042.jpg" }
        raw_json: { type: string, nullable: true, description: "Respuesta completa de la IA, tal cual, para auditoría.", example: "{\"sexo\":\"Masculino\",\"edad\":15}" }
        observaciones: { type: string, nullable: true, example: null }
        created_at: { type: string, format: date-time, example: "2026-09-04T13:42:11.000000Z" }
        updated_at: { type: string, format: date-time, example: "2026-09-04T13:42:11.000000Z" }

    # ------------------------------------------------------------------
    # Incidencias deportivas
    # ------------------------------------------------------------------

    IncidenteDeportivo:
      type: object
      description: Fila de `incidentes_deportivos`.
      properties:
        id: { type: integer, example: 128 }
        nombres: { type: string, example: "Matías Fuentes Rojas" }
        edad: { type: string, example: "15" }
        deporte: { type: string, example: "Fútbol" }
        tipo_lesion: { type: string, example: "Esguince" }
        ubicacion: { type: string, description: "Dónde ocurrió la lesión.", example: "Entrenamiento" }
        parte_cuerpo: { type: string, example: "Tobillo derecho" }
        descripcion: { type: string, example: "Torsión en cambio de dirección sobre pasto húmedo" }
        primeros_auxilios: { type: string, example: "Hielo local y vendaje compresivo" }
        gravedad:
          type: string
          description: |
            Texto libre. `GET /incidencia-deportivos/count-gravedad/{email}` cuenta con la
            comparación exacta `'Leve (sin tiempo fuera)'`: cualquier otra redacción no se
            contabiliza.
          example: "Leve (sin tiempo fuera)"
        estado: { type: string, example: "En tratamiento" }
        user_email: { type: string, format: email, description: "Usuario que registra la incidencia.", example: "kine.club@ergosanitas.com" }
        liga: { type: string, example: "Liga Regional O'Higgins" }
        club_deportivo:
          type: string
          description: |
            **Es la columna por la que filtran TODAS las consultas y estadísticas**, no
            `user_email`. Recibe el email del club.
          example: "club.deportivo@ergosanitas.com"
        categoria: { type: string, example: "Sub 17" }
        rut_paciente: { type: string, example: "21345678-9" }
        created_at: { type: string, format: date-time, example: "2026-08-30T18:12:00.000000Z" }
        updated_at: { type: string, format: date-time, example: "2026-08-30T18:12:00.000000Z" }

    IncidenciaEnvoltorio:
      type: object
      description: |
        Sobre común de `IncidenciasController`. **Devuelve 201 también en las lecturas.**
        Si el servicio retorna `null`, `0` o una colección vacía, el controlador lo trata
        como error y responde 500 aunque no haya fallado nada.
      properties:
        status: { type: string, enum: [success, error], example: "success" }
        message: { type: string, example: "Incidencia lista correctamente" }
        data:
          description: Depende del endpoint; puede ser un entero, un objeto o una lista.
      required: [status, message]

    # ------------------------------------------------------------------
    # Resultados de procedimientos almacenados
    # ------------------------------------------------------------------

    JuegoNivel:
      type: object
      description: |
        Fila de `juego_niveles`. Discriminada por `tipo`: `clinico` (badge del puntaje) o
        `completitud` (etiqueta de la barra de progreso). La banda clínica `sin_evaluar`
        usa `-1/-1` como centinela: no es un puntaje, marca la carta sin ningún dato.
      properties:
        id: { type: integer, example: 2 }
        tipo: { type: string, enum: [clinico, completitud], example: "clinico" }
        slug: { type: string, example: "medio" }
        nombre: { type: string, example: "MEDIO" }
        valor_min: { type: integer, example: 75 }
        valor_max: { type: integer, example: 94 }
        color_fondo: { type: string, example: "#fef3c7" }
        color_texto: { type: string, example: "#b45309" }
        orden: { type: integer, example: 2 }
        activo: { type: boolean, example: true }

    JuegoAtributo:
      type: object
      description: |
        Fila de `juego_atributos`: el catálogo de los cuatro atributos de la carta, para que
        el front no hardcodee iconos ni etiquetas. Los `slug` coinciden con los del array
        `atributos` de cada carta.
      properties:
        id: { type: integer, example: 1 }
        slug: { type: string, enum: [corazon, vitalidad, composicion, resistencia], example: "corazon" }
        nombre: { type: string, example: "Corazon" }
        icono: { type: string, example: "❤️" }
        descripcion: { type: string, example: "Electrocardiograma y antecedente cardiovascular" }
        orden: { type: integer, example: 1 }
        activo: { type: boolean, example: true }

    JuegoCarta:
      type: object
      description: |
        Una carta de paciente, calculada al vuelo por `SP_juego_cartas_club` sobre su
        **chequeo más reciente**. No se persiste: cada llamada recalcula.

        Dos ejes independientes, como el HTML de referencia:

        - **Puntaje clínico** (`puntaje`, `estrellas`, `nivel`) — qué tan bien está lo medido.
        - **Completitud** (`bloques_completos`, `progreso`, `estado`) — cuánto se ha medido.

        Cada atributo vale `ROUND(100 * puntos_obtenidos / puntos_máximos_de_los_presentes)`,
        o `null` si ningún sub-indicador está informado. `puntaje` es el promedio de los
        atributos medidos más `bonus`, acotado a 100.

        Si no hay **ningún** atributo medido (típico de un alumno cargado solo por Excel),
        `puntaje` es `null`, `estrellas` es `0` y el badge es `SIN EVALUAR`: la carta no se
        clasifica como `BAJO` por falta de datos.
      properties:
        rut: { type: string, example: "25527383-3" }
        nombre: { type: string, example: "Matías Fuentes Rojas" }
        edad: { type: string, description: "varchar en la base.", example: "16" }
        sexo:
          type: string
          description: "Sale de `chequeo_cardiovascular.sexo_paciente`."
          example: "Masculino"
        club:
          type: string
          description: "`chequeo_cardiovascular.user_email`."
          example: "brisas@ergosanitas.com"
        id_chequeo: { type: integer, example: 3718 }
        ficha:
          type: string
          description: "`CONCAT('#', LPAD(id, 6, '0'))`, para el `Ficha #001` de la UI."
          example: "#003718"
        fecha_atencion: { type: string, nullable: true, example: "2026-08-14 10:32:00" }
        total_chequeos: { type: integer, example: 7 }
        puntaje:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: "`null` cuando no hay ningún atributo medido."
          example: 90
        estrellas:
          type: integer
          minimum: 0
          maximum: 5
          description: "`CEIL(puntaje / 20)` acotado a 1-5; `0` si la carta está sin evaluar."
          example: 5
        nivel:
          allOf: [{ $ref: '#/components/schemas/JuegoNivel' }]
          description: "Banda `clinico` de `juego_niveles`. Nunca `null`: las bandas cubren -1 y 0-100 sin huecos."
        atributos:
          type: array
          description: "Siempre los cuatro, en el orden de `juego_atributos`."
          items:
            type: object
            properties:
              slug: { type: string, example: "corazon" }
              valor: { type: integer, nullable: true, minimum: 0, maximum: 100, example: 100 }
              medido:
                type: boolean
                description: "`false` equivale a `valor: null`; la UI pinta `––`."
                example: true
        atributos_medidos: { type: integer, minimum: 0, maximum: 4, example: 4 }
        bonus:
          type: integer
          minimum: 0
          maximum: 10
          description: |
            Puntos extra por la **calidad** de la bioimpedancia, no por tenerla. `0` si no hay
            fila en `bioimpedancia`. Queda fuera del 100 para no penalizar al 99,5% de
            pacientes que no tienen ese examen.
          example: 0
        insignia:
          type: string
          nullable: true
          description: "`InBody` cuando el paciente tiene bioimpedancia; `null` si no."
          example: null
        bloques_completos: { type: integer, minimum: 1, maximum: 5, example: 4 }
        progreso:
          type: integer
          description: "`bloques_completos * 20`. Mínimo 20: el bloque `chequeo` siempre existe."
          example: 80
        estado:
          allOf: [{ $ref: '#/components/schemas/JuegoNivel' }]
          description: "Banda `completitud` de `juego_niveles`."
        completitud:
          type: object
          properties:
            chequeo: { type: boolean, description: "Siempre `true`.", example: true }
            signos_vitales: { type: boolean, example: true }
            ecg: { type: boolean, example: true }
            bioimpedancia: { type: boolean, example: false }
            certificado: { type: boolean, example: true }

    ResultadoSP:
      description: |
        JSON decodificado desde la única columna que devuelve el procedimiento almacenado
        (`resultado_json` o `resultado`). **La forma exacta la define el SP instalado en la
        base, no el código PHP**, por eso aquí queda como estructura libre. Los ejemplos de
        cada operación son representativos de lo que devuelve la base en producción.
      oneOf:
        - type: object
          additionalProperties: true
        - type: array
          items:
            type: object
            additionalProperties: true

paths:

  # ====================================================================
  # UTILIDADES
  # ====================================================================

  /user:
    get:
      tags: [Utilidades]
      summary: Usuario autenticado por Sanctum (ejemplo de Laravel)
      operationId: getUser
      description: |
        Ruta de ejemplo que trae Laravel. Es **la única del proyecto con middleware**
        (`auth:sanctum`).

        Está declarada **dos veces** en `routes/api.php` (líneas 7 y 44) con el mismo
        cuerpo; Laravel se queda con la última.

        Sin sesión ni token devuelve la redirección/401 que arma Sanctum, no un sobre del
        proyecto.
      security:
        - sanctumSession: []
        - sanctumToken: []
      responses:
        '200':
          description: Usuario de la tabla `users`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, example: 47 }
                  name: { type: string, example: "Club Deportivo Municipal" }
                  email: { type: string, format: email, example: "club.deportivo@ergosanitas.com" }
                  email_verified_at: { type: string, format: date-time, nullable: true, example: null }
                  created_at: { type: string, format: date-time, example: "2025-03-11T14:02:31.000000Z" }
                  updated_at: { type: string, format: date-time, example: "2025-03-11T14:02:31.000000Z" }
        '401':
          description: Sin autenticar.

  /agenda-horas/health:
    get:
      tags: [Utilidades]
      summary: Health check del módulo de agenda
      operationId: healthAgenda
      description: Devuelve **texto plano**, no JSON. Útil para el liveness probe.
      responses:
        '200':
          description: Servicio arriba.
          content:
            text/plain:
              schema:
                type: string
              example: "Bienvenido a ergosanitas.com"

  /chequeo-cardiovascular/health:
    get:
      tags: [Utilidades]
      summary: Health check del módulo de chequeos
      operationId: healthCheckChequeo
      description: Devuelve **texto plano**, no JSON.
      responses:
        '200':
          description: Servicio arriba.
          content:
            text/plain:
              schema:
                type: string
              example: "Bienvenido a ergosanitas.com"

  /execute-link-simbolik:
    get:
      tags: [Utilidades]
      summary: Ejecuta `php artisan storage:link` por HTTP
      operationId: executeLinkSimbolik
      description: |
        Dispara `Artisan::call('storage:link')` desde una petición HTTP **sin
        autenticación** para enlazar `storage/app/public` con `public/storage`.

        Pensado solo para ambientes de desarrollo; en producción el enlace lo hace
        `dockerHub/entrypoint.sh` al arrancar. Devuelve texto plano incluso si el comando
        falla.
      responses:
        '200':
          description: Comando ejecutado.
          content:
            text/plain:
              schema:
                type: string
              example: "storage-link-execute success"

  # ====================================================================
  # AUTENTICACIÓN Y USUARIOS
  # ====================================================================

  /auth-login:
    post:
      tags: [Autenticación y usuarios]
      summary: Login con Google (verificación del id_token)
      operationId: authLogin
      description: |
        Verifica un `id_token` de Google con `google/apiclient` (no Socialite) usando
        `GOOGLE_CLIENT_ID` y `GOOGLE_CLIENT_SECRET` leídos con `env()` **dentro del propio
        controlador** — por eso `config:cache` rompe este endpoint.

        **No crea ni busca al usuario en la base**: solo valida el token y devuelve el
        `sub` y el `email` de Google. El comentario del código lo dice explícitamente
        ("Aquí puedes implementar la lógica para encontrar o crear un usuario").

        El controlador se llama `GoogleAuthControlle`, sin la "r" final: typo consolidado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: JWT `id_token` emitido por Google Sign-In.
                  example: "eyJhbGciOiJSUzI1NiIsImtpZCI6IjZmNzI1NDEwMWY..."
              required: [token]
            examples:
              login:
                summary: Token de Google
                value:
                  token: "eyJhbGciOiJSUzI1NiIsImtpZCI6IjZmNzI1NDEwMWY..."
      responses:
        '200':
          description: Token válido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Inicio de sesión exitoso" }
                  user:
                    type: object
                    properties:
                      google_id: { type: string, example: "117482910384756201938" }
                      email: { type: string, format: email, example: "usuario@gmail.com" }
              example:
                success: true
                message: "Inicio de sesión exitoso"
                user:
                  google_id: "117482910384756201938"
                  email: "usuario@gmail.com"
        '401':
          description: Token inválido o expirado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  message: { type: string, example: "Token inválido" }
              example:
                success: false
                message: "Token inválido"
        '500':
          description: |
            Excepción del cliente de Google. **Ojo: aquí el sobre cambia al formato B**
            dentro del mismo controlador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobreRespuestaB'
              example:
                response:
                  status: "Error en ejecucion"
                  mensaje: "Wrong number of segments in token"

  /auth-register:
    post:
      tags: [Autenticación y usuarios]
      summary: Login principal por email y contraseña
      operationId: authRegister
      description: |
        Pese al nombre, **es el login**, no un registro. Ejecuta `Auth::attempt()` contra la
        tabla `users` (password bcrypt) y, si pasa, lee `users_metadata` por `users_id` para
        armar la respuesta con el perfil, el logo y el RUT.

        Validaciones: `user_email` requerido y `email:rfc,dns` (**hace resolución DNS del
        dominio**: sin salida a internet o con un dominio sin registros MX/A, la validación
        falla); `user_password` requerido con mínimo 2 caracteres — el mensaje de error dice
        6, pero la regla es `min:2`.

        Si el usuario existe en `users` pero no en `users_metadata`, el acceso a
        `$usuario->id` sobre `null` lanza un `Error` que el `catch (\Exception)` no atrapa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_email: { type: string, format: email, example: "club.deportivo@ergosanitas.com" }
                user_password: { type: string, format: password, minLength: 2, example: "MiClave2026" }
              required: [user_email, user_password]
            examples:
              club:
                summary: Login de un club deportivo
                value:
                  user_email: "club.deportivo@ergosanitas.com"
                  user_password: "MiClave2026"
      responses:
        '200':
          description: Credenciales válidas. Se inicia la sesión de Laravel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLogin'
              example:
                success: true
                message: "Inicio de sesión exitoso"
                user:
                  user_id: 47
                  user_email: "club.deportivo@ergosanitas.com"
                  user_name: "Club Deportivo Municipal"
                  user_perfil: "Club Deportivo"
                  user_logo: "http://127.0.0.1:8000/Logo/club.deportivo@ergosanitas.com_66d0f1a3b9c2e.png"
                  rut_paciente: null
        '401':
          description: Credenciales incorrectas.
          content:
            application/json:
              example:
                success: false
                message: "Error Authenticacion"
                user: []
        '422':
          description: "Falla de validación (Laravel, requiere el header Accept: application/json)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
              example:
                message: "El E-Mail ingresado no es válido"
                errors:
                  user_email: ["El E-Mail ingresado no es válido"]
        '500':
          description: Excepción no controlada.
          content:
            application/json:
              example:
                success: false
                message: "SQLSTATE[HY000] [2002] Connection refused"
                user: []

  /login/create-user:
    post:
      tags: [Autenticación y usuarios]
      summary: Autoregistro del paciente a partir de su RUT
      operationId: createUser
      description: |
        Alta del **perfil 5 (paciente)**. Flujo completo:

        1. Busca en `chequeo_cardiovascular` el último chequeo del `rut_paciente` para
           tomar el nombre. **Si no existe ningún chequeo con ese RUT, el acceso a
           `$resChequeo->nombre` sobre `null` revienta con 500.**
        2. Escribe `email_paciente` en **todos** los chequeos de ese RUT.
        3. Crea el usuario en `users` (bcrypt) y en `users_metadata` con `perfiles_id = 5`,
           `status = 'S'` y **la contraseña también en claro** en `users_metadata.password`.
        4. Hace login inmediato con `Auth::attempt()` y devuelve el mismo sobre del login.

        No valida que el email esté libre: un email repetido revienta contra el índice
        único de `users`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rut_paciente: { type: string, pattern: '^\d{7,8}-[0-9kK]$', example: "21345678-9" }
                user_email: { type: string, format: email, example: "matias.fuentes@gmail.com" }
                user_password: { type: string, format: password, example: "Deporte2026" }
              required: [rut_paciente, user_email, user_password]
            examples:
              paciente:
                summary: Paciente que ya tiene un chequeo cargado
                value:
                  rut_paciente: "21345678-9"
                  user_email: "matias.fuentes@gmail.com"
                  user_password: "Deporte2026"
      responses:
        '200':
          description: Usuario creado y autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaLogin'
              example:
                success: true
                message: "Inicio de sesión exitoso"
                user:
                  user_id: 512
                  user_email: "matias.fuentes@gmail.com"
                  user_name: "Matías Fuentes Rojas"
                  user_perfil: "Paciente"
                  user_logo: null
                  rut_paciente: "21345678-9"
        '401':
          description: El login posterior a la creación falló.
          content:
            application/json:
              example:
                success: false
                message: "Error Authenticacion"
                user: []
        '500':
          description: No hay chequeo para ese RUT, o el email ya existe.
          content:
            application/json:
              examples:
                sinChequeo:
                  summary: RUT sin chequeos previos
                  value:
                    success: false
                    message: "Attempt to read property \"nombre\" on null"
                emailDuplicado:
                  summary: Email ya registrado
                  value:
                    success: false
                    message: "SQLSTATE[23000]: Integrity constraint violation: 1062 Duplicate entry 'matias.fuentes@gmail.com' for key 'users_email_unique'"

  /auth-register/load-logo:
    post:
      tags: [Autenticación y usuarios]
      summary: Sube el logo del club
      operationId: uploadLogo
      description: |
        Guarda el archivo en `public/Logo` con el nombre
        `{user_email}_{uniqid()}.{extensión}` y actualiza `users_metadata.user_logo` con
        `env('API_PATH_LOGO') . '/' . {archivo}`.

        Advertencias reales del código:

        - **`API_PATH_LOGO` no está en `.env.example`** aunque el código la usa: si falta,
          la URL guardada queda como `/archivo.png`.
        - **No hay validación del archivo**: ni tipo MIME, ni tamaño, ni extensión. Acepta
          cualquier cosa que PHP considere un upload válido.
        - Si no viene archivo o el upload es inválido, la función **no retorna nada** y
          Laravel responde con cuerpo vacío y status 200.
        - Si el `user_email` no existe en `users_metadata`, el `firstOrFail()` lanza un 404
          sin capturar.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Imagen del logo. Sin validación de tipo ni tamaño.
                user_email:
                  type: string
                  format: email
                  example: "club.deportivo@ergosanitas.com"
              required: [file, user_email]
      responses:
        '200':
          description: |
            Logo subido — **o** cuerpo vacío si no llegó archivo válido.
          content:
            application/json:
              example:
                success: true
                message: "Archivo subido correctamente"
                user_logo: "http://127.0.0.1:8000/Logo/club.deportivo@ergosanitas.com_66d0f1a3b9c2e.png"
        '404':
          description: El `user_email` no existe en `users_metadata` (`firstOrFail`).

  /auth-register/user_email/{perfil}:
    get:
      tags: [Autenticación y usuarios]
      summary: Lista los usuarios activos de un perfil
      operationId: listUserEmail
      description: |
        Devuelve `users_id`, `user_email` y `user_name` de `users_metadata` filtrando por
        `status = 'S'` y `perfiles_id = {perfil}`. Alimenta el combo "seleccionar club"
        (`selectClub`) de la búsqueda de chequeos.

        Respuesta **sin sobre**: es el array directo. Un perfil sin usuarios devuelve `[]`
        con status 200.
      parameters:
        - $ref: '#/components/parameters/PerfilPath'
      responses:
        '200':
          description: Listado de usuarios del perfil.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioListado'
              example:
                - users_id: 47
                  user_email: "club.deportivo@ergosanitas.com"
                  user_name: "Club Deportivo Municipal"
                - users_id: 63
                  user_email: "escuela.futbol@ergosanitas.com"
                  user_name: "Escuela de Fútbol Los Andes"

  /user-save:
    post:
      tags: [Autenticación y usuarios]
      summary: Crea un usuario (alta administrativa)
      operationId: userSave
      description: |
        Crea la fila en `users` (password con `bcrypt`) y en `users_metadata` con
        `status = 'S'`, `rut_paciente = null` y **la contraseña también en claro** en
        `users_metadata.password`.

        Los nombres de los campos del request **no coinciden** con los del resto de la API:
        aquí son `nombre_user`, `email_user`, `password_user` y `perfil_user`.

        No hay validación: si falta un campo, la escritura falla en la base y sale como 500.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre_user: { type: string, example: "Escuela de Fútbol Los Andes" }
                email_user: { type: string, format: email, example: "escuela.futbol@ergosanitas.com" }
                password_user: { type: string, format: password, example: "Andes2026" }
                perfil_user:
                  type: integer
                  description: '`perfiles_id`: 1 admin, 2 tester, 3 club, 5 paciente, 6 médico.'
                  example: 3
              required: [nombre_user, email_user, password_user, perfil_user]
            examples:
              nuevoClub:
                summary: Alta de un club deportivo
                value:
                  nombre_user: "Escuela de Fútbol Los Andes"
                  email_user: "escuela.futbol@ergosanitas.com"
                  password_user: "Andes2026"
                  perfil_user: 3
      responses:
        '200':
          description: Usuario creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobreExitoA'
              example:
                success: true
                message: "OK"
        '500':
          description: Error al escribir en `users` o `users_metadata`.
          content:
            application/json:
              example:
                success: false
                message: "SQLSTATE[23000]: Integrity constraint violation: 1062 Duplicate entry"

  /user-update-password:
    put:
      tags: [Autenticación y usuarios]
      summary: Cambia la contraseña del usuario
      operationId: userUpdatePassword
      description: |
        Actualiza la contraseña en **las dos tablas**: `users.password` con `bcrypt` y
        `users_metadata.password` en claro. Ambas deben mantenerse sincronizadas.

        El método se llama `UserUpdatePassowrd` (typo consolidado en el controlador).

        `UserMetadataService::UserUpdatePassowrd()` **se traga la excepción y devuelve
        `null`**, así que un email inexistente responde igual `200 OK` sin haber cambiado
        nada. El cliente no puede distinguir el éxito del fracaso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email_user: { type: string, format: email, example: "club.deportivo@ergosanitas.com" }
                password_user: { type: string, format: password, example: "NuevaClave2026" }
              required: [email_user, password_user]
            examples:
              cambio:
                value:
                  email_user: "club.deportivo@ergosanitas.com"
                  password_user: "NuevaClave2026"
      responses:
        '200':
          description: |
            Siempre que no explote el controlador. **No garantiza que la clave haya
            cambiado.**
          content:
            application/json:
              example:
                success: true
                message: "OK"
        '500':
          description: Excepción no controlada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobreErrorA'

  /user-update-ergo-pass:
    put:
      tags: [Autenticación y usuarios]
      summary: Actualiza la clave `ergo_pass`
      operationId: userUpdateErgoPass
      description: |
        Escribe `users_metadata.ergo_pass`. Es una clave secundaria de negocio, distinta de
        la contraseña de acceso.

        Igual que el endpoint anterior, el servicio se traga la excepción y devuelve `200`
        aunque el email no exista.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email_user: { type: string, format: email, example: "club.deportivo@ergosanitas.com" }
                ergo_pass: { type: string, example: "ERGO-2026-XY" }
              required: [email_user, ergo_pass]
            examples:
              cambio:
                summary: Nueva clave de negocio del club
                value:
                  email_user: "club.deportivo@ergosanitas.com"
                  ergo_pass: "ERGO-2026-XY"
      responses:
        '200':
          description: Petición procesada.
          content:
            application/json:
              example:
                success: true
                message: "OK"
        '500':
          description: Excepción no controlada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobreErrorA'

  /user-first-ergo-pass:
    post:
      tags: [Autenticación y usuarios]
      summary: Consulta la `ergo_pass` de un usuario
      operationId: userFirstErgoPass
      description: |
        Devuelve el valor de `users_metadata.ergo_pass` del email indicado. Es un **POST de
        lectura**.

        Si el email no existe, `->value()` devuelve `null` y la respuesta es `200` con
        `data.ergo_pass = null`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email_user: { type: string, format: email, example: "club.deportivo@ergosanitas.com" }
              required: [email_user]
            examples:
              consulta:
                summary: Consulta de la clave de un club
                value:
                  email_user: "club.deportivo@ergosanitas.com"
      responses:
        '200':
          description: Valor actual de `ergo_pass`.
          content:
            application/json:
              examples:
                conValor:
                  summary: Usuario con clave configurada
                  value:
                    success: true
                    data:
                      ergo_pass: "ERGO-2026-XY"
                sinValor:
                  summary: Email inexistente o sin clave
                  value:
                    success: true
                    data:
                      ergo_pass: null
        '500':
          description: Excepción no controlada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobreErrorA'

  # ====================================================================
  # SERVICIOS
  # ====================================================================

  /servicios:
    get:
      tags: [Servicios]
      summary: Lista el catálogo de servicios
      operationId: getServicios
      description: |
        Devuelve todos los servicios ordenados por `id` descendente, **sin sobre**.

        Detalle del código: primero hace `Servicios::where(['activo' => 's'])->firstOrFail()`
        y luego encadena `orderBy()->get()` sobre el modelo obtenido, de modo que el filtro
        `activo = 's'` **no se aplica al listado final** — devuelve todas las filas. El
        `firstOrFail()` sí actúa como guarda: si no existe ningún servicio activo, responde
        **404**.
      responses:
        '200':
          description: Catálogo completo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Servicio'
              example:
                - id: 3
                  nombre: "Chequeo Cardiovascular Deportivo"
                  precio: 25000
                  descripcion: "Evaluación preparticipativa con ECG y certificado médico"
                  activo: "s"
                  created_at: "2025-03-11T14:02:31.000000Z"
                  updated_at: "2025-03-11T14:02:31.000000Z"
                - id: 2
                  nombre: "Bioimpedancia"
                  precio: 12000
                  descripcion: "Análisis de composición corporal"
                  activo: "s"
                  created_at: "2025-02-02T11:00:00.000000Z"
                  updated_at: "2025-02-02T11:00:00.000000Z"
        '404':
          description: No hay ningún servicio con `activo = 's'`.

  /servicios/{name}:
    get:
      tags: [Servicios]
      summary: Detalle de un servicio por nombre
      operationId: showService
      description: |
        Busca por coincidencia **exacta** del nombre (no LIKE) y devuelve el modelo
        completo. Ojo: el nombre viaja en la URL, así que hay que URL-encodearlo.

        El controlador arma un array reducido con `id` y `precio` pero **devuelve el modelo
        completo**, no ese array.
      parameters:
        - name: name
          in: path
          required: true
          description: Nombre exacto del servicio, URL-encoded.
          schema:
            type: string
            example: "Chequeo Cardiovascular Deportivo"
      responses:
        '200':
          description: Servicio encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Servicio'
              example:
                id: 3
                nombre: "Chequeo Cardiovascular Deportivo"
                precio: 25000
                descripcion: "Evaluación preparticipativa con ECG y certificado médico"
                activo: "s"
                created_at: "2025-03-11T14:02:31.000000Z"
                updated_at: "2025-03-11T14:02:31.000000Z"
        '404':
          description: No existe un servicio con ese nombre exacto (`firstOrFail`).

  /servicios/like:
    post:
      tags: [Servicios]
      summary: Busca servicios por texto parcial
      operationId: likeServices
      description: |
        Búsqueda insensible a mayúsculas con `LOWER(nombre) LIKE %texto%`, ordenada por
        `id` descendente.

        El controlador exige que el **cuerpo sea un JSON parseable a array**: lee
        `php://input` y responde 400 si no lo es. Un cuerpo vacío o `form-data` da 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                textoValue:
                  type: string
                  description: Fragmento a buscar dentro del nombre.
                  example: "chequeo"
              required: [textoValue]
            examples:
              busqueda:
                summary: Buscar servicios que contengan "chequeo"
                value:
                  textoValue: "chequeo"
      responses:
        '200':
          description: Coincidencias (array, puede ir vacío).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Servicio'
              example:
                - id: 3
                  nombre: "Chequeo Cardiovascular Deportivo"
                  precio: 25000
                  descripcion: "Evaluación preparticipativa con ECG y certificado médico"
                  activo: "s"
                  created_at: "2025-03-11T14:02:31.000000Z"
                  updated_at: "2025-03-11T14:02:31.000000Z"
        '400':
          description: El cuerpo no es un JSON válido.
          content:
            application/json:
              example:
                status: "Bad Request"
                mensaje: "Http NO trae Datos para Procesar"
        '500':
          description: Error de ejecución.
          content:
            application/json:
              example:
                status: "Error en ejecucion"
                mensaje: "SQLSTATE[42S02]: Base table or view not found"

  # ====================================================================
  # AGENDA DE HORAS
  # ====================================================================

  /agenda-horas:
    get:
      tags: [Agenda de horas]
      summary: Lista todas las reservas
      operationId: getAgenda
      description: |
        Devuelve **todas** las reservas de `agenda_horas` ordenadas por `id` descendente,
        sin paginación ni filtro. El controlador arma el array campo por campo, así que
        `created_at` y `updated_at` no se incluyen.
      responses:
        '200':
          description: Listado de reservas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgendaHora'
              example:
                - id: 512
                  nombre_paciente: "Matías Fuentes Rojas"
                  rut_paciente: "21345678-9"
                  edad_paciente: "15"
                  direccion_paciente: "Av. Los Carrera 1450, Depto 32"
                  email_paciente: "apoderado.fuentes@gmail.com"
                  celular_paciente: "+56912345678"
                  sexo_paciente: "Masculino"
                  servicios_id: 3
                  comuna_paciente: "Rancagua"
                  pagado_paciente: "PAGADO"
                  fecha_reserva_paciente: "2026-09-18 10:30"

    post:
      tags: [Agenda de horas]
      summary: Crea una reserva de hora
      operationId: storeAgenda
      description: |
        Resuelve el `servicios_id` buscando el **nombre exacto** del servicio
        (`servicios_name`) con `firstOrFail()`: un nombre que no exista en el catálogo hace
        que el endpoint responda 500 con el mensaje del `ModelNotFoundException`.

        Requiere que el cuerpo sea un JSON parseable a array (lee `php://input`), o
        devuelve 400.

        No hay validación de campos: lo que no venga se guarda como `null` y, con MySQL en
        `STRICT_TRANS_TABLES`, las columnas `NOT NULL` hacen fallar el insert.

        Esta es la reserva que después confirma el pago WebPay: `WebPayResponse` marca
        `pagado_paciente = 'PAGADO'` buscando por `rut_paciente`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre_paciente: { type: string, example: "Matías Fuentes Rojas" }
                rut_paciente: { type: string, pattern: '^\d{7,8}-[0-9kK]$', example: "21345678-9" }
                edad_paciente: { type: string, example: "15" }
                direccion_paciente: { type: string, example: "Av. Los Carrera 1450, Depto 32" }
                email_paciente: { type: string, format: email, example: "apoderado.fuentes@gmail.com" }
                celular_paciente: { type: string, example: "+56912345678" }
                sexo_paciente: { type: string, example: "Masculino" }
                servicios_name:
                  type: string
                  description: Nombre EXACTO del servicio en el catálogo. Se traduce a `servicios_id`.
                  example: "Chequeo Cardiovascular Deportivo"
                comuna_paciente: { type: string, example: "Rancagua" }
                pagado_paciente: { type: string, example: "PENDIENTE" }
                fecha_reserva_paciente: { type: string, example: "2026-09-18 10:30" }
              required: [nombre_paciente, rut_paciente, servicios_name]
            examples:
              reserva:
                summary: Reserva de un chequeo
                value:
                  nombre_paciente: "Matías Fuentes Rojas"
                  rut_paciente: "21345678-9"
                  edad_paciente: "15"
                  direccion_paciente: "Av. Los Carrera 1450, Depto 32"
                  email_paciente: "apoderado.fuentes@gmail.com"
                  celular_paciente: "+56912345678"
                  sexo_paciente: "Masculino"
                  servicios_name: "Chequeo Cardiovascular Deportivo"
                  comuna_paciente: "Rancagua"
                  pagado_paciente: "PENDIENTE"
                  fecha_reserva_paciente: "2026-09-18 10:30"
      responses:
        '201':
          description: Reserva creada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AgendaHora'
                  status: { type: string, example: "OK" }
                  mensaje: { type: string, example: "Reserva con Exito" }
              example:
                data:
                  nombre_paciente: "Matías Fuentes Rojas"
                  rut_paciente: "21345678-9"
                  edad_paciente: "15"
                  direccion_paciente: "Av. Los Carrera 1450, Depto 32"
                  email_paciente: "apoderado.fuentes@gmail.com"
                  celular_paciente: "+56912345678"
                  sexo_paciente: "Masculino"
                  servicios_id: 3
                  comuna_paciente: "Rancagua"
                  pagado_paciente: "PENDIENTE"
                  fecha_reserva_paciente: "2026-09-18 10:30"
                  updated_at: "2026-09-05T12:10:44.000000Z"
                  created_at: "2026-09-05T12:10:44.000000Z"
                  id: 512
                status: "OK"
                mensaje: "Reserva con Exito"
        '400':
          description: El cuerpo no es un JSON válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobreRespuestaB'
              example:
                response:
                  status: "Bad Request"
                  mensaje: "Error en momento de ejecucion!!!"
        '500':
          description: El servicio no existe, o falló el insert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobreRespuestaB'
              example:
                response:
                  status: "Error en ejecucion"
                  mensaje: "No query results for model [App\\Models\\Servicios]."

