  /bioimpedancia/first-rut:
    post:
      tags: [Bioimpedancia]
      summary: Última bioimpedancia de un paciente (resumen)
      operationId: bioFirstRut
      description: |
        Devuelve solo `id`, `rut`, `nombre` y `archivo` de la medición más reciente del RUT.
        El campo `archivo` se convierte a **URL absoluta** con `url('Bioimpedancia/...')`.

        Si el paciente no tiene mediciones, responde `200` con `data: null`.

        El RUT debe enviarse ya normalizado como está guardado (sin puntos, con `k`
        minúscula si corresponde): la consulta es por igualdad exacta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rut_paciente: { type: string, example: "21345678-9" }
              required: [rut_paciente]
            examples:
              consulta:
                value:
                  rut_paciente: "21345678-9"
      responses:
        '200':
          description: Resumen de la última medición.
          content:
            application/json:
              examples:
                encontrado:
                  value:
                    success: true
                    message: "Listado obtenido correctamente"
                    data:
                      id: 314
                      rut: "21345678-9"
                      nombre: "Matías Fuentes Rojas"
                      archivo: "http://127.0.0.1:8000/Bioimpedancia/213456789_1042.jpg"
                sinDatos:
                  summary: Paciente sin bioimpedancia
                  value:
                    success: true
                    message: "Listado obtenido correctamente"
                    data: null
        '422':
          description: Falta `rut_paciente`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        '500':
          description: Error de consulta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobreErrorA'

  /bioimpedancia/create-bio:
    post:
      tags: [Bioimpedancia]
      summary: Crea una bioimpedancia vacía (solo identificación)
      operationId: createBio
      description: |
        Crea la fila con `rut`, `nombre` y `club`, sin ninguna medición. Sirve para
        preinscribir al paciente antes de subir la foto del informe.

        El RUT se normaliza quitando los puntos y pasando `K` a `k`.

        **A diferencia de `form-upload`, aquí es un `INSERT` puro, no un `updateOrCreate`**:
        llamarlo dos veces con el mismo RUT crea dos filas, y `form-upload` después
        actualizará solo una de ellas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rut: { type: string, example: "21.345.678-9" }
                nombre: { type: string, example: "Matías Fuentes Rojas" }
                club: { type: string, format: email, example: "club.deportivo@ergosanitas.com" }
              required: [rut, nombre, club]
            examples:
              alta:
                value:
                  rut: "21.345.678-9"
                  nombre: "Matías Fuentes Rojas"
                  club: "club.deportivo@ergosanitas.com"
      responses:
        '200':
          description: Fila creada.
          content:
            application/json:
              example:
                success: true
                message: "Datos guardados correctamente"
                data:
                  rut: "21345678-9"
                  nombre: "Matías Fuentes Rojas"
                  club: "club.deportivo@ergosanitas.com"
                  updated_at: "2026-09-05T12:31:02.000000Z"
                  created_at: "2026-09-05T12:31:02.000000Z"
                  id: 315
        '422':
          description: Falta `rut`, `nombre` o `club`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        '500':
          description: Error al crear.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobreErrorA'
              example:
                success: false
                message: "Error Crea Bioimpedancia"
                error: "SQLSTATE[HY000]: General error: 1364 Field 'rut' doesn't have a default value"

  /bioimpedancia/pdfRut/{rut_paciente}:
    get:
      tags: [Bioimpedancia]
      summary: Informe de bioimpedancia en PDF
      operationId: bioPDFRut
      description: |
        Genera con **mPDF** el informe de composición corporal del paciente. El HTML lo arma
        `BioimpedanciaService::BioPDFRut()`, que además llama a
        `AnalisisRutBioimpedanciaPrompt` para redactar la **interpretación clínica del
        resultado con IA** — por eso este endpoint tarda varios segundos y depende de que
        OpenAI responda.

        El archivo se descarga como `Certificado-{rut}.pdf`.

        A diferencia del PDF de chequeo, aquí sí hay `try/catch`: los errores salen como
        JSON 500.
      parameters:
        - $ref: '#/components/parameters/RutPaciente'
      responses:
        '200':
          description: PDF del informe.
          headers:
            Content-Disposition:
              schema:
                type: string
              example: 'attachment; filename="Certificado-21345678-9.pdf"'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '500':
          description: Sin datos para ese RUT, fallo de la IA o error de mPDF.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobreErrorA'
              example:
                success: false
                message: "Error procesando IA"
                error: "Attempt to read property \"imc\" on null"

