                  updated_at: "2026-09-04T13:42:11.000000Z"
        '422':
          description: Archivo no permitido, demasiado grande, o falta el `rut`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
              example:
                message: "The file field must be a file of type: jpg, jpeg, png."
                errors:
                  file: ["The file field must be a file of type: jpg, jpeg, png."]
        '500':
          description: |
            La IA no devolvió JSON válido (la fila con `raw_json` **ya quedó creada**), o
            falló la llamada a OpenAI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobreErrorA'
              examples:
                jsonInvalido:
                  value:
