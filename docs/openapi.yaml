                  medicamentosDiarios: "No Presenta"
                  sistemaOsteoarticular: "Sin Alteraciones"
                  sistemaCardiovascular: "Sin Alteraciones"
                  enfermedadesAnteriores: "Sin Alteraciones"
                  Recuperacion: "Sin Alteraciones"
                  gradoIncidenciaPosterio: "Sin Alteraciones"
                  status: "REVISION MEDICA"
                  user_email: "club.deportivo@ergosanitas.com"
                  user_email_update: "tester.terreno@ergosanitas.com"
                  fecha_atencion: "2026-09-04 09:31:00"
                  created_at: "2026-09-03T18:22:10.000000Z"
                  updated_at: "2026-09-04T13:22:10.000000Z"

    post:
      tags: [Chequeo cardiovascular]
      summary: Crea un chequeo cardiovascular
      operationId: storeChequeo
      description: |
        Alta de un chequeo. Reglas que aplica el controlador:

        - Valida `nombre` (string), `rut` (string) y `user_email` (email). **No valida el
          formato del RUT.**
        - `nombre` se normaliza con `ucwords(strtolower(trim(...)))`.
        - `estatura` cambia la coma decimal por punto.
        - Los campos clínicos vacíos toman un valor por defecto:
          `enfermedadesCronicas` y `medicamentosDiarios` -> `No Presenta`;
          `sistemaOsteoarticular`, `sistemaCardiovascular`, `enfermedadesAnteriores`,
          `Recuperacion` y `gradoIncidenciaPosterio` -> `Sin Alteraciones`.
        - `user_email_perfil` del request se guarda en la columna `user_email_update`.
        - **Si el perfil de `user_email` es 2 (tester)**, fija `fecha_atencion = now()` y
          `status = 'Testiado'`. En cualquier otro caso el `status` lo pone el default de la
          columna (`ingresado`).
        - Un request completamente vacío devuelve 400.

        `user_email` identifica al **club dueño del chequeo**: es la clave del filtrado por
        perfil 3 y de la facturación mensual.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string, example: "matías fuentes rojas" }
                rut: { type: string, pattern: '^\d{7,8}-[0-9kK]$', example: "21345678-9" }
                user_email: { type: string, format: email, description: "Club dueño del chequeo.", example: "club.deportivo@ergosanitas.com" }
                user_email_perfil: { type: string, format: email, description: "Usuario que digita. Se guarda en `user_email_update`.", example: "tester.terreno@ergosanitas.com" }
                edad: { type: string, example: "15" }
                estatura: { type: string, description: "Metros. Acepta coma y la convierte a punto.", example: "1,72" }
                peso: { type: string, example: "64.5" }
                hemoglucotest: { type: string, example: "92" }
                pulso: { type: string, example: "68" }
                presionArterial: { type: string, description: "Diastólica, pese al nombre.", example: "70" }
                presion_sistolica: { type: string, example: "120" }
                saturacionOxigeno: { type: string, example: "98" }
                temperatura: { type: string, example: "36.5" }
                fechaNacimiento: { type: string, example: "2010-04-22" }
                sexo_paciente: { type: string, example: "Masculino" }
                imc_paciente: { type: string, example: "21.8" }
                division_paciente: { type: string, example: "Sub 17" }
                medio_pago_paciente: { type: string, example: "Efectivo" }
                email_paciente: { type: string, format: email, example: "apoderado.fuentes@gmail.com" }
                enfermedadesCronicas: { type: string, example: "" }
                medicamentosDiarios: { type: string, example: "" }
                sistemaOsteoarticular: { type: string, example: "" }
                sistemaCardiovascular: { type: string, example: "" }
                enfermedadesAnteriores: { type: string, example: "" }
                Recuperacion: { type: string, example: "" }
                gradoIncidenciaPosterio: { type: string, example: "" }
              required: [nombre, rut, user_email]
            examples:
              minimo:
                summary: Mínimo aceptado por la validación
                value:
                  nombre: "Matías Fuentes Rojas"
                  rut: "21345678-9"
                  user_email: "club.deportivo@ergosanitas.com"
              completo:
                summary: Chequeo tomado en terreno por un perfil 2 (queda `Testiado`)
                value:
                  nombre: "matías fuentes rojas"
                  rut: "21345678-9"
                  user_email: "club.deportivo@ergosanitas.com"
                  user_email_perfil: "tester.terreno@ergosanitas.com"
                  edad: "15"
                  estatura: "1,72"
                  peso: "64.5"
                  hemoglucotest: "92"
                  pulso: "68"
                  presionArterial: "70"
                  presion_sistolica: "120"
                  saturacionOxigeno: "98"
                  temperatura: "36.5"
                  fechaNacimiento: "2010-04-22"
                  sexo_paciente: "Masculino"
                  imc_paciente: "21.8"
                  division_paciente: "Sub 17"
                  medio_pago_paciente: "Efectivo"
                  email_paciente: "apoderado.fuentes@gmail.com"
                  enfermedadesCronicas: "Asma bronquial"
                  medicamentosDiarios: "Salbutamol SOS"
                  sistemaOsteoarticular: ""
                  sistemaCardiovascular: ""
                  enfermedadesAnteriores: ""
                  Recuperacion: ""
                  gradoIncidenciaPosterio: ""
      responses:
        '201':
          description: Chequeo creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobreRespuestaB'
              example:
                response:
                  status: "OK"
                  mensaje: "Reserva con Exito"
        '400':
          description: Request vacío.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SobreRespuestaB'
              example:
                response:
                  status: "Bad Request"
                  mensaje: "Ingrese Valores"
        '422':
          description: Falla de validación de `nombre`, `rut` o `user_email`.
          content:
            application/json:
              schema:
